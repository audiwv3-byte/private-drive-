name: PRIVATE DRIVE - remove client switch from dispatcher navigation
on:
  push:
    branches: [fix/dispatcher-no-client-switch-20261109]
    paths:
      - .github/workflows/deploy-dispatcher-nav-20261109.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-drive-dispatcher-nav-no-client
  cancel-in-progress: false
jobs:
  guarded-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install requests Jinja2
      - run: python -m py_compile ops/dispatcher-nav-20261109/deploy.py
      - name: Confirm exact live source and simulated two-role navigation
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PD_NAV_DEPLOY: "0"
        run: python ops/dispatcher-nav-20261109/deploy.py
      - name: Backup live UI, remove dispatcher client switch and verify
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PD_NAV_DEPLOY: "1"
        run: python ops/dispatcher-nav-20261109/deploy.py
