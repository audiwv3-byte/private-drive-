name: PRIVATE DRIVE - web WSGI staging integration and ownership
on:
  push:
    branches: [feature/web-login-isolated-20261116]
    paths:
      - experimental/pd_web_wsgi_bridge_staged.py
      - experimental/test_pd_web_wsgi_bridge_staged.py
      - experimental/pd_web_identity_staged.py
      - experimental/pd_web_bookings_staged.py
      - .github/workflows/staged-web-wsgi-bridge-tests.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'Flask>=3,<4'
      - name: Compile staged modules
        run: python -m py_compile experimental/pd_web_identity_staged.py experimental/pd_web_bookings_staged.py experimental/pd_web_wsgi_bridge_staged.py
      - name: Run WSGI integration with fake Telegram app and isolated users
        run: |
          mkdir -p reports
          if python experimental/test_pd_web_wsgi_bridge_staged.py > reports/web_wsgi_bridge_staging.txt 2>&1; then
            echo WEB_WSGI_INTEGRATION_PASS >> reports/web_wsgi_bridge_staging.txt
          else
            echo WEB_WSGI_INTEGRATION_BLOCK >> reports/web_wsgi_bridge_staging.txt
          fi
      - name: Save sanitized report only
        if: always()
        run: |
          if [ -f reports/web_wsgi_bridge_staging.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/web_wsgi_bridge_staging.txt
            git commit -m "test(web): WSGI bridge isolation results" || true
            git push origin HEAD:feature/web-login-isolated-20261116
          fi
      - name: Require pass
        run: grep -Fqx WEB_WSGI_INTEGRATION_PASS reports/web_wsgi_bridge_staging.txt
