name: PRIVATE DRIVE - stage2 approval UI live-source dryrun no writes
on:
  push:
    branches: [fix/driver-approval-photo-rights-admin-filters-20261116]
    paths:
      - ops/stage2_ui_live_compatible_dryrun.py
      - .github/workflows/stage2-ui-compatible-dryrun.yml
permissions:
  contents: write
jobs:
  dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate staged dispatcher explanations against real production HTML GET-only
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          if python ops/stage2_ui_live_compatible_dryrun.py > reports/stage2_ui_live_dryrun.txt 2>&1; then
            echo STAGE2_UI_DRYRUN_PASS >> reports/stage2_ui_live_dryrun.txt
          else
            echo STAGE2_UI_DRYRUN_BLOCK >> reports/stage2_ui_live_dryrun.txt
          fi
      - name: Save sanitized dryrun result
        if: always()
        run: |
          if [ -f reports/stage2_ui_live_dryrun.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/stage2_ui_live_dryrun.txt
            git commit -m "test: record safe stage2 status hint overlay validation" || true
            git push origin HEAD:fix/driver-approval-photo-rights-admin-filters-20261116
          fi
      - name: Require all isolated tests green
        run: grep -Fqx STAGE2_UI_DRYRUN_PASS reports/stage2_ui_live_dryrun.txt
