name: PRIVATE DRIVE permanent Flutter iOS unsigned CI

on:
  push:
    branches:
      - feature/flutter-independent-auth
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ios-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-unsigned:
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify committed iOS project and safe metadata
        run: |
          set -euo pipefail
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner/Info.plist
          test -f ios/Runner.xcworkspace/contents.xcworkspacedata
          test -f pubspec.yaml
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = lt.privatedrive.privateDrive;' ios/Runner.xcodeproj/project.pbxproj
          grep -Fq '<string>PRIVATE DRIVE</string>' ios/Runner/Info.plist
          grep -Eq '^version: [0-9]+\.[0-9]+\.[0-9]+\+[0-9]+
          test ! -e ios/Flutter/Generated.xcconfig
          test ! -e ios/Flutter/flutter_export_environment.sh
          echo "Committed iOS project verified: PRIVATE DRIVE / $(grep '^version:' pubspec.yaml)"

      - name: Resolve packages, analyze and compile unsigned iOS Debug
        run: |
          set -euo pipefail
          flutter pub get
          flutter test --no-pub
          flutter analyze --no-fatal-infos
          flutter build ios --debug --no-codesign

      - name: Upload unsigned Debug artifact (not installable)
        uses: actions/upload-artifact@v4
        with:
          name: private-drive-ios-unsigned-debug
          path: flutter_app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7

      - name: Compile unsigned iOS Release (not distributable)
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign

      - name: Upload unsigned Release artifact (not installable)
        uses: actions/upload-artifact@v4
        with:
          name: private-drive-ios-unsigned-release
          path: flutter_app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
 pubspec.yaml
          test ! -e ios/Flutter/Generated.xcconfig
          test ! -e ios/Flutter/flutter_export_environment.sh
          echo 'Committed iOS project verified: PRIVATE DRIVE / 0.1.0+1'

      - name: Resolve packages, analyze and compile unsigned iOS Debug
        run: |
          set -euo pipefail
          flutter pub get
          flutter test --no-pub
          flutter analyze --no-fatal-infos
          flutter build ios --debug --no-codesign

      - name: Upload unsigned Debug artifact (not installable)
        uses: actions/upload-artifact@v4
        with:
          name: private-drive-ios-unsigned-debug
          path: flutter_app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7

      - name: Compile unsigned iOS Release (not distributable)
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign

      - name: Upload unsigned Release artifact (not installable)
        uses: actions/upload-artifact@v4
        with:
          name: private-drive-ios-unsigned-release
          path: flutter_app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
