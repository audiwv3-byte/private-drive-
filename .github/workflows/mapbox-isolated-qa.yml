name: PRIVATE DRIVE Mapbox isolated QA

on:
  push:
    branches: [test/passenger-mapbox-safe-fallback]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mapbox-android-web-qa:
    if: github.ref == 'refs/heads/test/passenger-mapbox-safe-fallback'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Flutter tests
        run: flutter test
      - name: Verify Mapbox activation and fallback configuration
        run: |
          flutter test --no-pub test/pd_mapbox_qa_config_test.dart --dart-define=PD_MAPBOX_QA=true
          flutter test --no-pub test/pd_mapbox_qa_config_test.dart --dart-define=MAPBOX_PUBLIC_TOKEN=pk.qa_fixture
          flutter test --no-pub test/pd_mapbox_qa_config_test.dart --dart-define=PD_MAPBOX_QA=true --dart-define=MAPBOX_PUBLIC_TOKEN=sk.qa_fixture
          flutter test --no-pub test/pd_mapbox_qa_config_test.dart --dart-define=PD_MAPBOX_QA=true --dart-define=MAPBOX_PUBLIC_TOKEN=pk.qa_fixture --dart-define=PD_EXPECT_MAPBOX=true
      - name: Prepare isolated platforms
        run: flutter create --platforms=android,web --project-name private_drive .
      - name: Build Android and Web with synthetic public-token placeholder
        run: |
          flutter build apk --debug --dart-define=PD_NATIVE_AUTH_API_URL= --dart-define=PD_MAPBOX_QA=true --dart-define=MAPBOX_PUBLIC_TOKEN=pk.synthetic_qa
          flutter build web --release --dart-define=PD_NATIVE_AUTH_API_URL= --dart-define=PD_ISOLATED_WEB_PREVIEW=true --dart-define=PD_MAPBOX_QA=true --dart-define=MAPBOX_PUBLIC_TOKEN=pk.synthetic_qa
          test -s build/web/index.html
          test -s build/web/main.dart.js
      - name: Verify configured public token reaches Mapbox without printing it
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request, urllib.parse, urllib.error
          token = os.environ.get('MAPBOX_PUBLIC_TOKEN', '')
          if not re.fullmatch(r'pk\.[A-Za-z0-9_.-]+', token):
              raise SystemExit('Public Mapbox token missing or invalid')
          for style in ('streets-v12', 'dark-v11'):
              url = 'https://api.mapbox.com/styles/v1/mapbox/' + style + '/tiles/256/10/583/325?' + urllib.parse.urlencode({'access_token': token})
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      if response.status != 200 or not response.headers.get('Content-Type', '').startswith('image/'):
                          raise SystemExit('Mapbox tile response not an image')
              except urllib.error.HTTPError as e:
                  raise SystemExit('Mapbox HTTP ' + str(e.code) + ' (URL restrictions may require browser-origin testing)')
              except Exception:
                  raise SystemExit('Mapbox network check failed')
              print(style + ': image response OK')
          PY
      # No token-bearing APK or web artifact is uploaded to this public repository.
