name: PRIVATE DRIVE - pilot and dispatcher status guard regression
on:
  push:
    branches: [fix/pilot-dispatch-status-guard-20261116]
    paths:
      - .github/workflows/pilot-status-guard-tests.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies only
        run: pip install -r requirements-runtime.lock.txt
      - name: Compile changes
        run: python -m py_compile miniapp_server.py pd_trip_runtime_v4.py test_pilot_status_guard.py test_release_validation.py
      - name: Test legacy route and full booking isolation in temporary DB
        run: |
          mkdir -p reports
          if python test_pilot_status_guard.py > reports/status_guard_unit.txt 2>&1; then
            echo 'STATUS_GUARD_UNIT_PASSED' >> reports/status_guard_unit.txt
          else
            echo 'STATUS_GUARD_UNIT_FAILED' >> reports/status_guard_unit.txt
          fi
          if python test_release_validation.py > /tmp/pd_guard_release.log 2>&1; then
            grep -E '^(PASS |ALL RELEASE CHECKS)' /tmp/pd_guard_release.log > reports/status_guard_release.txt || true
            echo 'STATUS_GUARD_RELEASE_PASSED' >> reports/status_guard_release.txt
          else
            echo 'STATUS_GUARD_RELEASE_FAILED' > reports/status_guard_release.txt
            tail -n 12 /tmp/pd_guard_release.log >> reports/status_guard_release.txt
          fi
      - name: Persist reports in isolated branch
        if: always()
        run: |
          if [ -d reports ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/status_guard_unit.txt reports/status_guard_release.txt
            git commit -m "test: status guard regression results" || true
            git push origin HEAD:fix/pilot-dispatch-status-guard-20261116
          fi
      - name: Enforce both gates
        run: |
          grep -q '^STATUS_GUARD_UNIT_PASSED$' reports/status_guard_unit.txt
          grep -q '^STATUS_GUARD_RELEASE_PASSED$' reports/status_guard_release.txt
