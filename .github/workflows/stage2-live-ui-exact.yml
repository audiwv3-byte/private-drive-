name: PRIVATE DRIVE - inspect stage2 dispatcher UI exact anchors
on:
  push:
    branches: [fix/driver-approval-photo-rights-admin-filters-20261116]
    paths:
      - ops/stage2_live_ui_exact_lines.py
      - .github/workflows/stage2-live-ui-exact.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read-only exact stage2 dispatcher source anchors
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          python ops/stage2_live_ui_exact_lines.py > reports/stage2_live_ui_exact_lines.txt
      - name: Save sanitized report
        if: always()
        run: |
          if [ -f reports/stage2_live_ui_exact_lines.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/stage2_live_ui_exact_lines.txt
            git commit -m "audit: store public source stage2 UI anchors" || true
            git push origin HEAD:fix/driver-approval-photo-rights-admin-filters-20261116
          fi
