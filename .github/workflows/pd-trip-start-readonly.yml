name: PRIVATE DRIVE - exact trip start server code audit (GET only)
on:
  push:
    branches: [ops/paypal-readonly-live-audit-20261116]
    paths:
      - .github/workflows/pd-trip-start-readonly.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: mkdir -p reports
      - name: Read selected trip action and authorization source lines only
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python ops/pd_trip_start_readonly_diagnostic.py > reports/trip_start_readonly_diagnostic.txt
      - name: Commit sanitized audit result
        if: always()
        run: |
          if [ -f reports/trip_start_readonly_diagnostic.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/trip_start_readonly_diagnostic.txt
            git commit -m "audit: record trip status guard and handler comparison" || true
            git push origin HEAD:ops/paypal-readonly-live-audit-20261116
          fi
