name: Validate release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-runtime.lock.txt
      - run: pip install -r requirements-runtime.lock.txt
      - run: python test_release_validation.py
      - run: python test_tips_entry.py
