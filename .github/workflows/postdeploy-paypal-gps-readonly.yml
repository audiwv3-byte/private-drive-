name: PRIVATE DRIVE - postdeploy PayPal GPS audit read only
on:
  push:
    branches: [audit/postdeploy-paypal-gps-20261116]
    paths:
      - ops/postdeploy_paypal_gps_readonly.py
      - .github/workflows/postdeploy-paypal-gps-readonly.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: GET-only postdeployment source verification
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          python ops/postdeploy_paypal_gps_readonly.py > reports/postdeploy_paypal_gps_readonly.txt
      - name: Save sanitized summary only
        if: always()
        run: |
          if [ -f reports/postdeploy_paypal_gps_readonly.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/postdeploy_paypal_gps_readonly.txt
            git commit -m "audit: save postdeploy structural status" || true
            git push origin HEAD:audit/postdeploy-paypal-gps-20261116
          fi
