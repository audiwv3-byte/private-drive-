<section class="pd-wheel-panel" id="pdFirstRideWheel" data-channel="website" hidden aria-labelledby="pdWheelTitle">
<h2 id="pdWheelTitle">Колесо первой поездки</h2>
<div class="pd-wheel-figure" aria-hidden="true"><div class="pd-wheel-disc"><span>5%</span><span>10%</span><span>15%</span><span>20%</span></div></div>
<p role="status" aria-live="polite"></p>
<button type="button" data-wheel-spin hidden>Крутить колесо</button>
<button type="button" data-wheel-book hidden>Заказать со скидкой</button>
<form hidden><label>Номер телефона <input name="phone" type="tel" autocomplete="tel" placeholder="+370…" required></label>
<label hidden>Одноразовый код <input name="code" inputmode="numeric" autocomplete="one-time-code"></label>
<button type="submit">Получить код</button></form>
</section>
