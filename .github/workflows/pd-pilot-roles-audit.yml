name: PRIVATE DRIVE - pilot roles browser audit (read only)
on:
  push:
    branches: [ops/paypal-readonly-live-audit-20261116]
    paths:
      - .github/workflows/pd-pilot-roles-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify production anonymous UX and role containment without writes
        run: |
          mkdir -p reports
          python ops/pd_pilot_roles_browser_audit.py > reports/pilot_roles_browser.txt
      - name: Save verified outcome
        if: always()
        run: |
          if [ -f reports/pilot_roles_browser.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/pilot_roles_browser.txt
            git commit -m "audit: record pilot roles browser validation" || true
            git push origin HEAD:ops/paypal-readonly-live-audit-20261116
          fi
