name: PRIVATE DRIVE - privacy payment time audit
on:
  push:
    branches: [audit/prelaunch-passenger-pilot-dispatch-20261106]
    paths:
      - ops/pa_privacy_payment_time_readonly.py
      - .github/workflows/privacy-payment-time-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - run: python -m py_compile ops/pa_privacy_payment_time_readonly.py
      - name: Diagnose live access control, trip time and payment without writes
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: python ops/pa_privacy_payment_time_readonly.py
