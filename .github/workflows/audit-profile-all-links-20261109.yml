name: PRIVATE DRIVE - audit profile repeated contact links
on:
  push:
    branches: [fix/profile-all-redundant-links-20261109]
    paths:
      - .github/workflows/audit-profile-all-links-20261109.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install requests
      - name: Audit live passenger profile and contacts without writes
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: python ops/profile-all-links-20261109/audit.py
