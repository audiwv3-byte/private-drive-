name: Pilot registration QA
on:
  push:
    branches: [qa/pilot-minimal-form]
  workflow_dispatch:
jobs:
  enrollment:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Flask Werkzeug Pillow cryptography 'psycopg[binary]'
      - run: python -m unittest -v test_dispatcher_staging_wsgi test_web_dispatcher test_pilot_minimal_registration
        env:
          PD_TEST_FRESH_POSTGRES: postgresql://postgres:local_test@localhost:5432/postgres
      - run: node --test test_miniapp_interactions.cjs
