name: QA38 isolated release candidates
on:
  push:
    branches: [qa/qa38-release]
permissions:
  contents: read
jobs:
  android-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PD_NATIVE_SMS_LIVE: "NO"
      PD_PAYMENT_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Audit public entry gates
        run: python3 ops/qa/qa38_release_audit.py
      - name: Generate isolated Android scaffold
        run: |
          flutter create --platforms=android --org=lt.privatedrive.qa --project-name=private_drive qa_android
          cp -R flutter_app/lib/. qa_android/lib/
          cp -R flutter_app/assets qa_android/assets
          cp flutter_app/pubspec.yaml qa_android/
          if test -f flutter_app/pubspec.lock; then cp flutter_app/pubspec.lock qa_android/; fi
          python3 ops/qa/prepare_android_release.py qa_android
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 30 -dname "CN=PRIVATE DRIVE isolated QA,O=QA,C=LT"
      - name: Build release-mode AAB using ephemeral QA key
        working-directory: qa_android
        run: |
          flutter pub get
          flutter pub deps --json > "$RUNNER_TEMP/qa38-deps.json"
          flutter build appbundle --release --no-pub --dart-define=PD_NATIVE_AUTH_API_URL=https://qa.invalid --dart-define=PD_INTERNAL_QA=false --dart-define=PD_QA28_GPS=false --dart-define=PD_QA_IOS_GPS=false --dart-define=PD_QA29_LOOPBACK=false --dart-define=PD_ISOLATED_WEB_PREVIEW=false
          test -s build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
      - name: Verify packaged manifest and SDK
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=qa_android/build/app/outputs/bundle/release/app-release.aab
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=qa_android/build/app/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/manifest.xml"
          python3 ops/qa/check_android_release.py "$RUNNER_TEMP/manifest.xml"
          mkdir -p qa_aab
          cp qa_android/build/app/outputs/bundle/release/app-release.aab qa_aab/PRIVATE-DRIVE-QA-ONLY.aab
          cp "$RUNNER_TEMP/manifest.xml" qa_aab/manifest.xml
          cp "$RUNNER_TEMP/qa38-deps.json" qa_aab/dependencies.json
          (cd qa_aab && sha256sum PRIVATE-DRIVE-QA-ONLY.aab > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: private-drive-isolated-release-aab-not-for-store
          path: qa_aab/
          retention-days: 3
  ios-device-release:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Prepare foreground-only isolated release profile
        run: |
          python3 ops/qa/qa38_release_audit.py
          python3 -c 'import plistlib; from pathlib import Path; p=Path("flutter_app/ios/Runner/Info.plist"); d=plistlib.loads(p.read_bytes()); d.pop("UIBackgroundModes",None); d.pop("NSLocationAlwaysAndWhenInUseUsageDescription",None); p.write_bytes(plistlib.dumps(d))'
      - name: Build arm64 device Release without signing
        working-directory: flutter_app
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 -c 'from pathlib import Path; p=Path("pubspec.yaml"); s=p.read_text(); old="  integration_test:\n    sdk: flutter\n"; assert s.count(old)==1; p.write_text(s.replace(old,""))'
          flutter pub get
          flutter pub deps --json > "$RUNNER_TEMP/qa38-deps.json"
          test -s "$RUNNER_TEMP/qa38-deps.json"
          flutter build ios --release --no-codesign --no-pub --dart-define=PD_NATIVE_AUTH_API_URL=https://qa.invalid --dart-define=PD_INTERNAL_QA=false --dart-define=PD_QA28_GPS=false --dart-define=PD_QA_IOS_GPS=false --dart-define=PD_QA29_LOOPBACK=false --dart-define=PD_ISOLATED_WEB_PREVIEW=false
      - name: Validate device binary and packaged privacy configuration
        run: |
          plutil -lint flutter_app/build/ios/iphoneos/Runner.app/Info.plist
          plutil -lint flutter_app/build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy
          python3 ops/qa/check_ios_release.py flutter_app/build/ios/iphoneos/Runner.app
          mkdir -p qa_ios
          cp "$RUNNER_TEMP/qa38-deps.json" qa_ios/dependencies.json
          cp flutter_app/build/ios/iphoneos/Runner.app/Info.plist qa_ios/
          cp flutter_app/build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy qa_ios/
          ditto -c -k --keepParent flutter_app/build/ios/iphoneos/Runner.app qa_ios/PRIVATE-DRIVE-QA-UNSIGNED.zip
          (cd qa_ios && shasum -a 256 PRIVATE-DRIVE-QA-UNSIGNED.zip > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: private-drive-ios-device-release-unsigned-not-for-store
          path: qa_ios/
          retention-days: 3
