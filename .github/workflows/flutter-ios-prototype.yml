name: PRIVATE DRIVE Flutter iOS unsigned prototype

on:
  push:
    branches:
      - feature/flutter-independent-auth
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ios-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-unsigned:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create isolated iOS Flutter scaffold
        run: |
          flutter create --platforms=ios --org=lt.privatedrive --project-name=private_drive private_drive_ios_build
          cp flutter_app/lib/main.dart private_drive_ios_build/lib/main.dart
          rm -f private_drive_ios_build/test/widget_test.dart
      # Export the genuine Flutter-created Xcode scaffold; later commit only reviewed sources.
      - name: Archive generated iOS scaffold for source review
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/private-drive-ios-scaffold.tar.gz" \
            -C private_drive_ios_build ios pubspec.yaml analysis_options.yaml
      - name: Upload iOS scaffold source (unsigned, no secrets)
        uses: actions/upload-artifact@v4
        with:
          name: private-drive-ios-scaffold-source
          path: ${{ runner.temp }}/private-drive-ios-scaffold.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Analyze and compile unsigned iOS app
        working-directory: private_drive_ios_build
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter build ios --debug --no-codesign
      - name: Upload unsigned iOS compile artifact (not installable)
        uses: actions/upload-artifact@v4
        with:
          name: private-drive-ios-unsigned-debug
          path: private_drive_ios_build/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
      - name: Compile unsigned iOS Release (not distributable)
        working-directory: private_drive_ios_build
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign

      - name: Upload unsigned iOS Release artifact (not installable)
        uses: actions/upload-artifact@v4
        with:
          name: private-drive-ios-unsigned-release
          path: private_drive_ios_build/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
