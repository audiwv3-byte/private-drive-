name: PRIVATE DRIVE issue30 - live integration contract GET only
on:
  push:
    branches: [feature/issue-30-live-integration-dryrun-20261117]
    paths:
      - ops/issue30_live_contract_readonly.py
      - .github/workflows/issue30-live-contract-readonly.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read only source of deployed onboarding and HTML
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          python ops/issue30_live_contract_readonly.py > reports/issue30_live_contract_readonly.txt
      - name: Commit source-code-only compatibility notes
        if: always()
        run: |
          if [ -f reports/issue30_live_contract_readonly.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/issue30_live_contract_readonly.txt
            git commit -m "audit(issue30): snapshot nonsecret live source contract excerpts" || true
            git push origin HEAD:feature/issue-30-live-integration-dryrun-20261117
          fi
