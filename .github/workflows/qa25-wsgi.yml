name: QA25 shared WSGI order integration
on:
  push:
    branches: [qa/unified-staging-integration]
    paths: ['.github/workflows/qa25-wsgi.yml','tests/test_qa25_wsgi.py','wsgi.py','pd_qa25_wsgi.py','pd_qa25_telegram_orders.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa25:
    if: github.ref == 'refs/heads/qa/unified-staging-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: private_drive_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d private_drive_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-sms-render.txt flask pytest
      - run: python -m pytest -v tests/test_qa25_wsgi.py
        env:
          PD_AUTH_TEST_DATABASE_URL: postgresql://postgres:isolated-test@127.0.0.1:5432/private_drive_test
          PD_PAYMENT_MODE: disabled
          PD_NATIVE_SMS_LIVE: 'NO'
