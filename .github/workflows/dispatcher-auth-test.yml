name: Dispatcher browser auth tests
on:
  push:
    branches:
      - feature/web-dispatcher-browser-auth
      - feature/dispatcher-owner-mfa
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatcher-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install 'Flask==3.0.3' 'Werkzeug==3.1.9'
      - name: Test browser dispatcher in isolation
        run: python -m unittest -v test_web_dispatcher.py test_dispatcher_staging_wsgi.py test_passenger_dispatch_qa.py test_unified_accounts_schema.py test_dispatch_accounts.py test_private_drive_encrypted_pg_backup.py test_db_connection_transition.py
