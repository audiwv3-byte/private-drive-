name: PRIVATE DRIVE - repair welcome language buttons (safe backup)
on:
  push:
    branches: [fix/welcome-language-buttons-20261109]
    paths:
      - .github/workflows/fix-welcome-language-buttons-20261109.yml
      - ops/language-buttons-20261109/fix_buttons.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-drive-language-button-fix
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install requests Jinja2
      - run: python -m py_compile ops/language-buttons-20261109/fix_buttons.py
      - name: Confirm exact source and validate style and JS with zero writes
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PD_LANGUAGE_BUTTON_DEPLOY: "0"
        run: python ops/language-buttons-20261109/fix_buttons.py
      - name: Backup and fix three language buttons, then verify public page
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PD_LANGUAGE_BUTTON_DEPLOY: "1"
        run: python ops/language-buttons-20261109/fix_buttons.py
