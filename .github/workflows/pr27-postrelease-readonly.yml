name: PRIVATE DRIVE - PR27 independent postrelease GET verification
on:
  push:
    branches: [feature/pilot-cockpit-isolated-20261116]
    paths:
      - ops/pr27_postrelease_readonly.py
      - .github/workflows/pr27-postrelease-readonly.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compare actual PythonAnywhere HTML and public site without changing them
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          python ops/pr27_postrelease_readonly.py > reports/pr27_postrelease_readonly.txt
      - name: Save sanitized verification result
        if: always()
        run: |
          if [ -f reports/pr27_postrelease_readonly.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/pr27_postrelease_readonly.txt
            git commit -m "audit(pilot): save independently checked deployed HTML SHA" || true
            git push origin HEAD:feature/pilot-cockpit-isolated-20261116
          fi
