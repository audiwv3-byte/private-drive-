name: PRIVATE DRIVE - inspect automatic map prompt read only
on:
  push:
    branches: [fix/no-auto-location-prompt-20261109]
    paths:
      - .github/workflows/audit-auto-location-prompt-20261109.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - name: Inspect live modal source and automatic triggers
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: python ops/geo-prompt-20261109/audit.py
