name: PRIVATE DRIVE Flutter run diagnostics

on:
  push:
    branches: [feature/flutter-independent-auth]
    paths: [.github/workflows/flutter-ci-diagnostics.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flutter-independent-auth
      - name: Extract failure lines for workflow run 583
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          repository = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {'Accept': 'application/vnd.github+json',
                     'Authorization': 'Bearer ' + token,
                     'X-GitHub-Api-Version': '2022-11-28'}
          def fetch(path, raw=False):
              url = 'https://api.github.com/repos/' + repository + path
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=45) as res:
                  body = res.read().decode('utf-8', 'replace')
              return body if raw else json.loads(body)
          runs = fetch('/actions/workflows/flutter-prototype-apk.yml/runs?per_page=100')['workflow_runs']
          run = next((r for r in runs if r['run_number'] == 583), None)
          lines = ['# PRIVATE DRIVE — test-branch CI diagnostic', '',
                   'Source build run: #583', 'No production service accessed.', '']
          if run is None:
              lines.append('Run #583 not found among 100 latest workflow runs.')
          else:
              lines.extend(['Run: ' + run['html_url'],
                            'Commit: ' + run['head_sha'],
                            'Conclusion: ' + str(run['conclusion']), ''])
              jobs = fetch('/actions/runs/' + str(run['id']) + '/jobs?per_page=100')['jobs']
              for job in jobs:
                  if job['conclusion'] != 'failure':
                      continue
                  lines.append('## Failed job: ' + job['name'])
                  for step in job['steps']:
                      if step['conclusion'] == 'failure':
                          lines.append('Failed step: ' + step['name'])
                  try:
                      log = fetch('/actions/jobs/' + str(job['id']) + '/logs', raw=True)
                      pattern = re.compile(r'error\s*[•:]|Exception:|failed|issues found|undefined|isn.t defined|Target of URI|Expected |not found|cannot find|No named parameter|analysis', re.I)
                      matches = []
                      for number, entry in enumerate(log.splitlines(), 1):
                          if pattern.search(entry):
                              entry = entry.replace(token, '[REDACTED]')
                              entry = re.sub(r'Bearer\s+\S+', 'Bearer [REDACTED]', entry)
                              matches.append(str(number) + ': ' + entry[-320:])
                      lines.append('~~~text')
                      lines.extend(matches[-55:] or ['No matching error messages'])
                      lines.append('~~~')
                  except Exception as exc:
                      lines.append('Log access failed: ' + type(exc).__name__)
          Path('flutter_app/CI_CHECK_REPORT.md').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines[-55:]))
          PY
      - name: Commit report only to test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/CI_CHECK_REPORT.md
          git diff --cached --quiet && exit 0
          git commit -m "ci: save Flutter run 583 error summary"
          git push origin HEAD:feature/flutter-independent-auth
