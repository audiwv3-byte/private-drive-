name: PRIVATE DRIVE - cash new-booking anchors GET only
on:
  push:
    branches: [audit/selected-launch-updates-20261116]
    paths:
      - ops/live_cash_booking_anchor_audit.py
      - .github/workflows/live-cash-anchor-audit.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect actual production new-booking cash controls without modifying anything
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          python ops/live_cash_booking_anchor_audit.py > reports/live_cash_booking_anchors.txt
      - name: Save report
        if: always()
        run: |
          if [ -f reports/live_cash_booking_anchors.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/live_cash_booking_anchors.txt
            git commit -m "audit: production cash and historic compatibility anchors" || true
            git push origin HEAD:audit/selected-launch-updates-20261116
          fi
