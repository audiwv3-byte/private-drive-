name: PRIVATE DRIVE - read-only production compatibility
on:
  push:
    branches: [fix/miniapp-ui-gps-pricing-20261106]
    paths:
      - ops/pa_production_preflight.py
      - .github/workflows/production-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - name: Check live source anchors without changing PythonAnywhere
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: python ops/pa_production_preflight.py
