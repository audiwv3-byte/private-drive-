name: Passenger order channels
on:
  push:
    branches: [qa/merged-passenger-gps-20261126]

permissions:
  contents: read
jobs:
  channels:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: private_drive_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-miniapp.txt -r requirements-sms-render.txt reportlab stripe==11.4.1 pytest playwright
      - run: python -m playwright install chromium --only-shell
      - run: node test_role_visibility.cjs && node test_miniapp_interactions.cjs
      - run: python -m pytest -v -s tests/test_passenger_channels.py tests/test_native_order_quote.py
        env:
          PD_AUTH_TEST_DATABASE_URL: postgresql://postgres:isolated-test@127.0.0.1:5432/private_drive_test
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --no-pub test/passenger_channel_test.dart test/native_orders_api_test.dart test/native_pilot_orders_test.dart test/passenger_ride_entry_test.dart
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Compile the normal application entry for an isolated debug package
        run: |
          flutter create --platforms=android --org=lt.privatedrive.qa --project-name=private_drive qa_android
          cp -R flutter_app/lib/. qa_android/lib
          cp -R flutter_app/assets qa_android/assets
          cp flutter_app/pubspec.yaml qa_android/
          cd qa_android
          flutter pub get
          flutter build apk --debug --no-pub --dart-define=PD_NATIVE_AUTH_API_URL=https://qa.invalid
          test -s build/app/outputs/flutter-apk/app-debug.apk
  ios-build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Compile the normal application entry for the iPhone simulator
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter build ios --simulator --debug --no-codesign --no-pub --dart-define=PD_NATIVE_AUTH_API_URL=https://qa.invalid
          test -d build/ios/iphonesimulator/Runner.app
