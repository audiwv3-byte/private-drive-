name: Native authentication tests
on:
  push:
    branches:
      - feature/flutter-independent-auth
  workflow_dispatch:
jobs:
  native-auth-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: native_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d native_auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test OTP and Twilio Verify adapters without production access
        run: python -m unittest -v test_native_auth.py test_native_auth_http.py test_native_auth_sms.py test_native_auth_sessions.py test_native_auth_roles.py test_twilio_verify.py test_native_auth_twilio_http.py test_native_sms_isolated_config.py test_twilio_setup_diagnostics.py
      - name: Test two sign-in methods and session lifecycle in isolated PostgreSQL
        env:
          PD_AUTH_TEST_DATABASE_URL: postgresql://postgres:isolated-test@127.0.0.1:5432/native_auth_test
        run: |
          python -m pip install -r requirements-sms-render.txt
          python -m unittest -v test_native_auth_postgres_flow.py
