name: PRIVATE DRIVE - active pilot approval source differential GET only
on:
  push:
    branches: [fix/driver-approval-photo-rights-admin-filters-20261116]
    paths:
      - ops/live_driver_approval_differential_readonly.py
      - .github/workflows/live-driver-approval-differential.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read only structure in current production code
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          python ops/live_driver_approval_differential_readonly.py > reports/live_driver_approval_differential.txt
      - name: Save sanitized report
        if: always()
        run: |
          if [ -f reports/live_driver_approval_differential.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/live_driver_approval_differential.txt
            git commit -m "audit: active driver approval and dashboard code feature inventory" || true
            git push origin HEAD:fix/driver-approval-photo-rights-admin-filters-20261116
          fi
