name: Issue 30 - offline synthetic tests and GET-only source audit

on:
  push:
    branches:
      - feature/issue-30-document-review-offline-20261117
      - feature/issue-30-release-candidate-20261117
    paths:
      - .github/workflows/issue30-readonly-check.yml
      - pd_issue30_readonly_audit.py
      - pd_issue30_connection.py
      - test_pd_issue30_connection_lifecycle.py
      - pd_issue30_live_request_guard_probe.py
      - pd_issue30_patch_live_request_guard_offline.py
      - test_pd_issue30_live_request_guard.py
      - pd_issue30_rc_build.py
      - test_pd_issue30_rc_manifest.py
      - pd_issue30_live_ast_probe.py
      - pd_issue30_live_transition_probe.py
      - pd_issue30_live_schema_probe.py
      - pd_issue30_live_handler_inspect.py
      - pd_issue30_live_runtime_structure_probe.py
      - pd_issue30_admin_review_routes.py
      - test_pd_issue30_admin_review_routes.py
      - test_pd_issue30_live_core_db_contract.py
      - pd_issue30_patch_live_wsgi_offline.py
      - test_pd_issue30_live_wsgi_patch.py
      - pd_issue30_live_admin_html_probe.py
      - pd_issue30_patch_live_admin_html_offline.py
      - test_pd_issue30_live_admin_html_patch.py test_pd_issue30_live_request_guard.py
      - miniapp/static/pd_issue30_admin_review.js
      - miniapp/static/pd_issue30_admin_review.css
      - 'tests/issue30/**'
      - pd_issue30_patch_live_onboarding_offline.py
      - test_pd_issue30_live_onboarding_patch.py
      - pd_issue30_patch_live_dispatcher_offline.py
      - test_pd_issue30_live_dispatcher_patch.py
      - pd_issue30_release_readiness_offline.py
      - test_pd_issue30_release_readiness_offline.py
      - pd_document_review.py
      - test_pd_document_review_synthetic.py
      - pd_issue30_stage_adapter.py
      - test_pd_issue30_stage_adapter.py
      - pd_issue30_decision_bridge.py
      - test_pd_issue30_decision_bridge.py
      - pd_issue30_document_storage_guard.py
      - test_pd_issue30_document_storage_guard.py
      - pd_issue30_flask_integration.py
      - test_pd_issue30_flask_integration.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    name: Synthetic SQLite tests (no production access)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated Flask test dependency
        run: python -m pip install 'Flask>=3,<4'
      - name: Validate opt-in admin UI JavaScript syntax
        run: node --input-type=module --check < miniapp/static/pd_issue30_admin_review.js
      - name: Run isolated tests
        run: python -m unittest -v test_pd_document_review_synthetic.py test_pd_issue30_stage_adapter.py test_pd_issue30_decision_bridge.py test_pd_issue30_document_storage_guard.py test_pd_issue30_flask_integration.py test_pd_issue30_release_readiness_offline.py test_pd_issue30_connection_lifecycle.py
  live-patch-synthetic:
    name: Verified live-source patch in isolated Flask/SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated test dependencies
        run: python -m pip install 'Flask>=3,<4' Pillow pillow-heif requests
      - name: GET verified deployed source and test patched copy only in memory
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: |
          if [ -z "$PA_API_TOKEN" ]; then
            echo "BLOCKED: read-only API token unavailable; tests not run"
            exit 1
          fi
          python -m unittest -v test_pd_issue30_live_onboarding_patch.py test_pd_issue30_live_dispatcher_patch.py test_pd_issue30_admin_review_routes.py test_pd_issue30_live_core_db_contract.py test_pd_issue30_live_wsgi_patch.py test_pd_issue30_live_admin_html_patch.py

  readonly-audit:
    name: PythonAnywhere GET-only source fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install requests
        run: python -m pip install requests
      - name: Read-only source check (never mutate server)
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: |
          if [ -z "$PA_API_TOKEN" ]; then
            echo "AUDIT_NOT_RUN: PA_API_TOKEN unavailable to workflow"
            exit 0
          fi
          python pd_issue30_readonly_audit.py
          python pd_issue30_live_ast_probe.py
          python pd_issue30_live_transition_probe.py
          python pd_issue30_live_schema_probe.py
          python pd_issue30_live_handler_inspect.py
          python pd_issue30_live_runtime_structure_probe.py
          python pd_issue30_live_admin_html_probe.py
          python pd_issue30_live_request_guard_probe.py

  browser-synthetic:
    name: Isolated Chromium dispatcher UI (no production access)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install free browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.1
      - name: Install test-only Chromium
        run: npx playwright install --with-deps chromium
      - name: Test localhost synthetic dispatcher in Chromium
        run: npx playwright test --config tests/issue30/playwright.config.mjs
      - name: Retain failure evidence (no personal data)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue30-synthetic-browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

  release-candidate:
    name: Staging-only reproducible RC SHA-256 manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install source GET-only dependencies
        run: python -m pip install requests
      - name: Verify all RC pins and generate only metadata manifest
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: |
          if [ -z "$PA_API_TOKEN" ]; then
            echo "BLOCKED: source validation token missing"
            exit 1
          fi
          python -m unittest -v test_pd_issue30_rc_manifest.py
          python pd_issue30_rc_build.py --manifest issue30_rc_manifest.json
      - name: Publish non-sensitive manifest only; no source or photos
        uses: actions/upload-artifact@v4
        with:
          name: issue30-staging-only-sha-manifest
          path: issue30_rc_manifest.json
          retention-days: 7
          if-no-files-found: error
