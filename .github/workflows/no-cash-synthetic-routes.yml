name: PRIVATE DRIVE - no cash synthetic Flask and Telegram legacy
on:
  push:
    branches: [audit/selected-launch-updates-20261116]
    paths:
      - ops/test_no_cash_synthetic_routes.py
      - ops/cash_offline_overlay_dryrun.py
      - .github/workflows/no-cash-synthetic-routes.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Flask to execute extracted production route handlers
        run: pip install 'Flask>=3,<4'
      - name: Simulate old Telegram buttons, direct API cash, historical cash on fake SQLite
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          if python ops/test_no_cash_synthetic_routes.py > reports/no_cash_synthetic_routes.txt 2>&1; then
            echo 'PR28_SYNTHETIC_ROUTES_PASS' >> reports/no_cash_synthetic_routes.txt
          else
            echo 'PR28_SYNTHETIC_ROUTES_BLOCK' >> reports/no_cash_synthetic_routes.txt
          fi
      - name: Save diagnostic results
        if: always()
        run: |
          if [ -f reports/no_cash_synthetic_routes.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/no_cash_synthetic_routes.txt
            git commit -m "test: historical cash isolation and new booking no-cash API regression" || true
            git push origin HEAD:audit/selected-launch-updates-20261116
          fi
      - name: Gate on all checked outcomes
        run: grep -Fqx 'PR28_SYNTHETIC_ROUTES_PASS' reports/no_cash_synthetic_routes.txt
