name: PRIVATE DRIVE - stage2 disabled button independent postrelease GET
on:
  push:
    branches: [fix/driver-approval-photo-rights-admin-filters-20261116]
    paths:
      - ops/stage2_button_visual_postrelease_readonly.py
      - .github/workflows/stage2-button-visual-postrelease.yml
permissions:
  contents: write
jobs:
  independent-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Independent production GET and public website verification only
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          python ops/stage2_button_visual_postrelease_readonly.py > reports/stage2_button_visual_postrelease.txt
      - name: Publish sanitized test outcome to feature branch
        if: always()
        run: |
          if [ -f reports/stage2_button_visual_postrelease.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/stage2_button_visual_postrelease.txt
            git commit -m "audit: independent SHA verification of deployed stage2 disabled button" || true
            git push origin HEAD:fix/driver-approval-photo-rights-admin-filters-20261116
          fi
