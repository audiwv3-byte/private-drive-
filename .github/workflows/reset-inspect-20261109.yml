name: PRIVATE DRIVE - inspect authorised test reset
on:
  push:
    branches: [fix/prelaunch-registration-notices-20261109]
    paths: [ops/prelaunch-20261109/inspect_reset.py, .github/workflows/reset-inspect-20261109.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install requests cryptography
      - env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: python ops/prelaunch-20261109/inspect_reset.py
