name: PRIVATE DRIVE approved welcome - source audit
on:
  push:
    branches: [feature/approved-welcome-visual-20261109]
    paths:
      - ops/welcome-20261109/preflight.py
      - .github/workflows/approved-welcome-audit-20261109.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install requests
      - name: Read-only inspect live onboarding source and available visual assets
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: python ops/welcome-20261109/preflight.py
