name: PRIVATE DRIVE Flutter Web test preview

on:
  push:
    branches:
      - feature/flutter-independent-auth
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-web-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Generate isolated Web scaffold (never deploy)
        run: |
          flutter create --platforms=web --org=lt.privatedrive --project-name=private_drive private_drive_web_build
          cp -R flutter_app/lib/. private_drive_web_build/lib/
          cp -R flutter_app/assets private_drive_web_build/assets
          cp flutter_app/pubspec.yaml private_drive_web_build/pubspec.yaml
          cp flutter_app/analysis_options.yaml private_drive_web_build/analysis_options.yaml
          mkdir -p private_drive_web_build/test
          cp flutter_app/test/pd_http_api_test.dart private_drive_web_build/test/pd_http_api_test.dart
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          source = Path('flutter_app/assets/brand/private_drive_logo.webp')
          data = source.read_bytes()
          assert hashlib.sha256(data).hexdigest() == '550d3b75e1a50fc4feb4d34bec1727c7dd0f6a947f94e16295b834abbfbde35f'
          image = Image.open(source).convert('RGB')
          rgba = image.convert('RGBA')
          rgb = image.load()
          px = rgba.load()
          for y in range(image.height):
              for x in range(image.width):
                  red, green, blue = rgb[x, y]
                  strength = max(red, green, blue)
                  t = min(1.0, max(0.0, (strength - 25.0) / 70.0))
                  opacity = round(255 * t * t * (3 - 2 * t))
                  px[x, y] = (red, green, blue, opacity)
          dest = Path('private_drive_web_build/assets/brand/private_drive_logo_transparent.png')
          rgba.save(dest, format='PNG', optimize=True)
          pubspec = Path('private_drive_web_build/pubspec.yaml')
          marker = '    - assets/brand/private_drive_logo.webp'
          contents = pubspec.read_text()
          assert contents.count(marker) == 1
          pubspec.write_text(contents.replace(marker, marker + '\n    - assets/brand/private_drive_logo_transparent.png'))
          assert dest.stat().st_size > 10000
          PY
      - name: Flutter Web analysis and offline HTTP unit tests
        working-directory: private_drive_web_build
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test test/pd_http_api_test.dart
      - name: Build standalone iPhone Safari browser preview (no SMS)
        working-directory: private_drive_web_build
        run: |
          flutter build web --release --dart-define=PD_NATIVE_AUTH_API_URL=
          test -s build/web/index.html
          test -s build/web/main.dart.js
      - name: Upload standalone Web preview artifact (not hosted)
        uses: actions/upload-artifact@v4
        with:
          name: private-drive-web-preview
          path: private_drive_web_build/build/web/
          retention-days: 7
          if-no-files-found: error
