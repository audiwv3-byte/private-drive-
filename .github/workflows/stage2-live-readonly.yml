name: PRIVATE DRIVE - stage2 registration live read only
on:
  push:
    branches: [fix/driver-approval-photo-rights-admin-filters-20261116]
    paths:
      - ops/stage2_live_readonly_source.py
      - .github/workflows/stage2-live-readonly.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect current stage2 source only
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          python ops/stage2_live_readonly_source.py > reports/stage2_live_readonly_source.txt
      - name: Save sanitized report
        if: always()
        run: |
          if [ -f reports/stage2_live_readonly_source.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/stage2_live_readonly_source.txt
            git commit -m "audit: record stage2 required document and UI code metadata" || true
            git push origin HEAD:fix/driver-approval-photo-rights-admin-filters-20261116
          fi
