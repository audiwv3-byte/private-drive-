name: QA dispatcher order GPS in Chromium
on:
  push:
    branches: [qa/dispatcher-order-gps-browser, qa/android-dispatcher-map-e2e]
  workflow_dispatch:
    inputs:
      apk_run:
        description: Successful QA29 run containing the debug APK
        type: string
        default: '45839158308'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  map:
    if: github.ref == 'refs/heads/qa/android-dispatcher-map-e2e' || github.ref == 'refs/heads/qa/dispatcher-order-gps-browser'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: private_drive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d private_drive_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PD_AUTH_TEST_DATABASE_URL: postgresql://postgres:isolated-test@127.0.0.1:5432/private_drive_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b3158cd9510262b5694d8cd7073fa23c70d85b18
          path: qa_server
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2b250eb5e3d4540431ade62c482de1eb6de1570a
          path: qa_android
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated browser and API dependencies
        run: |
          python -m pip install -r qa_server/requirements-sms-render.txt flask playwright
          command -v google-chrome
          curl -fsS --retry 3 https://unpkg.com/leaflet@1.9.4/dist/leaflet.js -o leaflet.js
          curl -fsS --retry 3 https://unpkg.com/leaflet@1.9.4/dist/leaflet.css -o leaflet.css
      - name: Observe assigned order, two fixes, finish and renderer control
        if: github.ref == 'refs/heads/qa/dispatcher-order-gps-browser'
        run: bash ops/qa/run_dispatcher_map_browser.sh
      - name: Download the verified QA29 debug package
        if: github.ref == 'refs/heads/qa/android-dispatcher-map-e2e'
        uses: actions/download-artifact@v4
        with:
          name: private-drive-gps-qa29-apk
          path: qa_apk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.apk_run || '45839158308' }}
      - name: Verify the package and enable the Android emulator
        if: github.ref == 'refs/heads/qa/android-dispatcher-map-e2e'
        run: |
          (cd qa_apk && sha256sum --check SHA256SUMS)
          grep -F "name='lt.privatedrive.private_drive.gps_qa29'" qa_apk/badging.txt
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify foreground, screen-off and completed order in Chromium
        if: github.ref == 'refs/heads/qa/android-dispatcher-map-e2e'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash ops/qa/run_dispatcher_map_browser.sh --android-apk qa_apk/PRIVATE-DRIVE-GPS-QA29.apk
