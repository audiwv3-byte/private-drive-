name: PRIVATE DRIVE - PR25 two-source verified production backup
on:
  push:
    branches: [ops/pr25-live-overlay-dryrun-20261116]
    paths:
      - .github/workflows/pr25-backup-two-sources.yml
      - ops/pr25_backup_two_sources.py
permissions:
  contents: read
concurrency:
  group: private-drive-pr25-two-source-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check backup script syntax
        run: python -m py_compile ops/pr25_backup_two_sources.py
      - name: Create private source-only backups, verify readback (no deploy)
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python ops/pr25_backup_two_sources.py
