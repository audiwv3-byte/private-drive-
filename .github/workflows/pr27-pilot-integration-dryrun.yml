name: PRIVATE DRIVE - cockpit integration, live overlay GET-only
on:
  push:
    branches: [feature/pilot-cockpit-isolated-20261116]
    paths:
      - experimental/pd_pilot_cockpit_staged.js
      - experimental/pd_pilot_cockpit_adapter_staged.js
      - experimental/pd_pilot_cockpit_staged.css
      - experimental/test_pd_pilot_integration_adapter.cjs
      - ops/pr27_live_pilot_overlay_dryrun.py
      - .github/workflows/pr27-pilot-integration-dryrun.yml
permissions:
  contents: write
jobs:
  dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax, approved pilot and no passenger/dispatcher regression
        run: |
          mkdir -p reports
          node --check experimental/pd_pilot_cockpit_staged.js
          node --check experimental/pd_pilot_cockpit_adapter_staged.js
          node experimental/test_pd_pilot_cockpit_staged.cjs > reports/pr27_live_overlay_tests.txt 2>&1
          node experimental/test_pd_pilot_integration_adapter.cjs >> reports/pr27_live_overlay_tests.txt 2>&1
      - name: Verify integration in temporary copy of current PythonAnywhere HTML
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python ops/pr27_live_pilot_overlay_dryrun.py >> reports/pr27_live_overlay_tests.txt 2>&1
      - name: Save sanitized report only
        if: always()
        run: |
          if [ -f reports/pr27_live_overlay_tests.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/pr27_live_overlay_tests.txt
            git commit -m "test(pilot): save live cockpit overlay checks" || true
            git push origin HEAD:feature/pilot-cockpit-isolated-20261116
          fi
      - name: Require pass
        run: grep -Fqx 'PILOT_LIVE_OVERLAY_DRYRUN_PASS' reports/pr27_live_overlay_tests.txt
