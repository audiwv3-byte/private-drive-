name: PRIVATE DRIVE synthetic encrypted restore privacy QA
on:
  push:
    branches:
      - qa/r2-synthetic-restore-20261124
    paths:
      - .github/workflows/qa-r2-synthetic-restore.yml
      - 'qa/r2-synthetic-restore/**'

permissions:
  contents: read

jobs:
  synthetic-restore:
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'audiwv3-byte/private-drive-' &&
          github.ref == 'refs/heads/qa/r2-synthetic-restore-20261124' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build disposable PostgreSQL 18 and age test image
        shell: bash
        run: docker build --tag pd-synthetic-restore:ci qa/r2-synthetic-restore/
      - name: Verify fail-closed policy with synthetic inputs
        working-directory: qa/r2-synthetic-restore
        run: python3 -B -m unittest -v synthetic_postgres_age_roundtrip_mock_test
      - name: Verify only approved data survives encrypted restore
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:exec,nosuid,nodev,size=256m,mode=1777 \
            --user postgres --entrypoint /usr/bin/python3 \
            --volume "$PWD/qa/r2-synthetic-restore:/opt/synthetic:ro" \
            pd-synthetic-restore:ci -B /opt/synthetic/synthetic_postgres_age_roundtrip.py
