name: PRIVATE DRIVE live website screenshots
on:
  push:
    branches:
      - feature/website-private-drive-preview
    paths:
      - .github/workflows/site-preview-visual.yml
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PREVIEW_URL: https://private-drive-corporate-preview-20261122.onrender.com
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium / Playwright
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Capture three actual published pages
        run: |
          mkdir -p private-drive-screenshots
          cat > capture-preview.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          const root = process.env.PREVIEW_URL;
          if (!root || !root.startsWith('https://')) throw Error('Test HTTPS URL missing');
          (async () => {
            const browser = await chromium.launch({headless:true, args:['--no-sandbox']});
            const jobs = [
              {id:'01-desktop-home', path:'/', width:1440, height:900, mobile:false},
              {id:'02-mobile-home', path:'/', width:390, height:844, mobile:true},
              {id:'03-mobile-booking', path:'/order-map.html?mode=preorder&route=kaunas', width:390, height:844, mobile:true}
            ];
            const results = [];
            try {
              for (const job of jobs) {
                const context = await browser.newContext({
                  viewport:{width:job.width,height:job.height},
                  deviceScaleFactor:1,
                  isMobile:job.mobile,
                  hasTouch:job.mobile,
                  locale:'ru-RU'
                });
                const page = await context.newPage();
                const url = new URL(job.path,root).href;
                const response = await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
                if(!response || !response.ok()) throw Error(job.id+': HTTP '+response?.status());
                await page.locator('main').waitFor({state:'visible',timeout:15000});
                await page.evaluate(()=>document.fonts.ready);
                await page.waitForTimeout(1800);
                const meta = await page.evaluate(() => ({
                  title:document.title,
                  viewport:innerWidth,
                  scrollWidth:document.documentElement.scrollWidth,
                  images:[...document.querySelectorAll('img')].map(el=>({
                    src:el.getAttribute('src'),loaded:el.complete&&el.naturalWidth>0
                  })),
                  formPresent:!!document.querySelector('#orderForm'),
                  legalNotice:!!document.querySelector('a[href="privacy.html"]'),
                  verifyButton:!!document.querySelector('#verifyAddresses')
                }));
                const filename='private-drive-screenshots/'+job.id+'.png';
                await page.screenshot({path:filename,fullPage:true,animations:'disabled'});
                results.push({screen:job.id,file:filename,viewport:job.width+'x'+job.height,...meta});
                await context.close();
              }
            } finally { await browser.close(); }
            fs.writeFileSync('private-drive-screenshots/report.json',JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
            if(results.some(x=>x.scrollWidth>x.viewport)) throw Error('Horizontal overflow found');
            if(!results[2].formPresent || !results[2].legalNotice || !results[2].verifyButton) {
              throw Error('Booking form or privacy/check controls missing');
            }
            if(results.some(x=>x.images.some(img=>!img.loaded))) throw Error('At least one image did not load');
          })().catch(err=>{console.error(err);process.exitCode=1});
          JS
          node capture-preview.cjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-drive-live-three-screenshots
          path: private-drive-screenshots/
          retention-days: 14
          if-no-files-found: error

  five-design-concepts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium / Playwright
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Capture five distinct page concepts from real project assets
        run: |
          mkdir -p private-drive-five-concepts
          cat > capture-concepts.cjs <<'JS'
          const { chromium } = require('playwright');
          const { pathToFileURL } = require('node:url');
          const fs = require('node:fs');
          const path = require('node:path');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try {
              const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1,locale:'ru-RU'});
              await page.goto(pathToFileURL(path.resolve('site_preview/alternatives/five-concepts.html')).href,{waitUntil:'load'});
              await page.evaluate(()=>document.fonts.ready);
              const audit=[];
              for(let n=1;n<=5;n++){
                const section=page.locator('#concept-'+n);
                const imageStatus=await section.evaluate(el=>[...el.querySelectorAll('img')].map(i=>({
                  src:i.getAttribute('src'),loaded:i.complete&&i.naturalWidth>0
                })));
                const filename='private-drive-five-concepts/concept-'+n+'.png';
                await section.screenshot({path:filename,animations:'disabled'});
                const dimensions=await section.evaluate(el=>({width:el.getBoundingClientRect().width,height:el.getBoundingClientRect().height}));
                audit.push({concept:n,file:filename,images:imageStatus,...dimensions});
              }
              fs.writeFileSync('private-drive-five-concepts/report.json',JSON.stringify(audit,null,2));
              console.log(JSON.stringify(audit,null,2));
              if(audit.length!==5||audit.some(a=>a.images.some(i=>!i.loaded)||a.width!==1440||a.height!==900))throw Error('Concept screenshot audit failed');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node capture-concepts.cjs
      - name: Upload five concept screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-drive-five-design-concepts
          path: private-drive-five-concepts/
          retention-days: 14
          if-no-files-found: error
