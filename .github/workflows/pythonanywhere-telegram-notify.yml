name: PRIVATE DRIVE - Telegram backup notifications

on:
  workflow_run:
    workflows:
      - PRIVATE DRIVE - protected diagnostic and backup
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ops/trigger-telegram-notification-test.txt

permissions: {}

jobs:
  notify:
    name: Report backup status to Telegram (no server changes)
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      (github.event.workflow_run.head_repository.full_name == 'audiwv3-byte/private-drive-' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send result without exposing credentials
        shell: bash
        env:
          PD_TELEGRAM_BOT_TOKEN: ${{ secrets.PD_TELEGRAM_BOT_TOKEN }}
          PD_TELEGRAM_CHAT_ID: ${{ secrets.PD_TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          BACKUP_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BACKUP_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ.get("PD_TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("PD_TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              print("TELEGRAM_NOT_CONFIGURED: check both PD_TELEGRAM_BOT_TOKEN and PD_TELEGRAM_CHAT_ID in repository Actions secrets")
              sys.exit(1)

          if os.environ.get("EVENT_NAME") in ("workflow_dispatch", "push"):
              status = "TEST (notification setup)"
              run_line = "GitHub Actions manual notification test"
          else:
              conclusion = os.environ.get("BACKUP_CONCLUSION", "unknown").lower()
              if conclusion == "success":
                  status = "SUCCESS (backup workflow completed)"
              elif conclusion == "failure":
                  status = "FAILURE (backup workflow failed)"
              else:
                  status = "CHECK REQUIRED (" + (conclusion if conclusion in ("cancelled", "timed_out", "skipped") else "unknown") + ")"
              run_id = os.environ.get("BACKUP_RUN_ID", "")
              if not run_id.isdecimal():
                  print("Invalid workflow run ID")
                  sys.exit(1)
              run_line = "https://github.com/audiwv3-byte/private-drive-/actions/runs/" + run_id

          message = (
              "PRIVATE DRIVE — Backup notification\n"
              "Status: " + status + "\n"
              "Repository: audiwv3-byte/private-drive-\n"
              + run_line + "\n"
              "Note: a successful job means the backup script reported VERIFIED; review the run log for the snapshot path."
          )
          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message,
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.telegram.org/bot" + token + "/sendMessage",
              data=data,
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = json.load(response)
                  if response.status != 200 or body.get("ok") is not True:
                      print("TELEGRAM_SEND_FAILED: API did not confirm delivery")
                      sys.exit(1)
          except urllib.error.HTTPError as exc:
              print("TELEGRAM_SEND_FAILED: HTTP", exc.code)
              sys.exit(1)
          except Exception as exc:
              print("TELEGRAM_SEND_FAILED:", type(exc).__name__)
              sys.exit(1)
          print("TELEGRAM_NOTIFICATION_SENT")
          PY
