name: PRIVATE DRIVE - live roles and extras read only audit
on:
  push:
    branches: [audit/postdeploy-paypal-gps-20261116]
    paths:
      - ops/live_roles_extras_readonly.py
      - .github/workflows/live-roles-extras-readonly.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Audit live source, no mutations
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          python ops/live_roles_extras_readonly.py > reports/live_roles_extras_readonly.txt
      - name: Save summary of feature presence
        if: always()
        run: |
          if [ -f reports/live_roles_extras_readonly.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/live_roles_extras_readonly.txt
            git commit -m "audit: record live roles and optional services" || true
            git push origin HEAD:audit/postdeploy-paypal-gps-20261116
          fi
