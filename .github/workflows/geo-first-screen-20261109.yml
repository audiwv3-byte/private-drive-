name: PRIVATE DRIVE - fix geo modal over language screen
on:
  push:
    branches: [fix/geo-after-onboarding-20261109]
    paths:
      - .github/workflows/geo-first-screen-20261109.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-drive-geo-first-screen-20261109
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests Jinja2
      - name: Validate patch without production changes
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PD_GEO_DEPLOY: "0"
        run: python ops/geo-first-screen-20261109/fix_geo.py
      - name: Backup and patch only the live geo popup guard
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PD_GEO_DEPLOY: "1"
        run: python ops/geo-first-screen-20261109/fix_geo.py
