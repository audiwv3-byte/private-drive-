name: PRIVATE DRIVE - hide duplicate role language selector
on:
  push:
    branches: [fix/hide-duplicate-role-language-20261109]
    paths:
      - .github/workflows/fix-role-language-20261109.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-drive-role-language-only
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install requests Jinja2
      - run: python -m py_compile ops/role-language-20261109/fix.py
      - name: Validate exact production UI change without writing
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PD_ROLE_LANGUAGE_DEPLOY: "0"
        run: python ops/role-language-20261109/fix.py
      - name: Backup, remove duplicate role language button and verify site
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PD_ROLE_LANGUAGE_DEPLOY: "1"
        run: python ops/role-language-20261109/fix.py
