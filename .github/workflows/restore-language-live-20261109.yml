name: PRIVATE DRIVE - restore language-first UI (source backup)
# Third guarded attempt: Jinja and Node compile checks passed offline; source rollback remains automatic.
on:
  push:
    branches: [fix/restore-first-language-telegram-onboarding-20261109]
    paths:
      - .github/workflows/restore-language-live-20261109.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-drive-restore-language-live
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests Jinja2
      - name: Compile isolated script (no hosting changes)
        run: python -m py_compile ops/onboarding-restore-20261109/deploy_ui.py
      - name: Verify current source fingerprints and exact patches (dry-run)
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PD_UI_DEPLOY: "0"
        run: python ops/onboarding-restore-20261109/deploy_ui.py
      - name: Restore language and Telegram onboarding after verified source backup
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PD_UI_DEPLOY: "1"
        run: python ops/onboarding-restore-20261109/deploy_ui.py
