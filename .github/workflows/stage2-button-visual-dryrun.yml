name: PRIVATE DRIVE - stage2 disabled approval visual only dryrun
on:
  push:
    branches: [fix/driver-approval-photo-rights-admin-filters-20261116]
    paths:
      - ops/stage2_button_visual_live_dryrun.py
      - .github/workflows/stage2-button-visual-dryrun.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact deployed HTML and server gate, run synthetic UI states
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          if python -m py_compile ops/stage2_button_visual_live_dryrun.py && python ops/stage2_button_visual_live_dryrun.py > reports/stage2_button_visual_dryrun.txt 2>&1; then
            echo STAGE2_BUTTON_VISUAL_CI_SUCCESS >> reports/stage2_button_visual_dryrun.txt
          else
            echo STAGE2_BUTTON_VISUAL_CI_FAILED >> reports/stage2_button_visual_dryrun.txt
          fi
      - name: Save only sanitized result
        if: always()
        run: |
          if [ -f reports/stage2_button_visual_dryrun.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/stage2_button_visual_dryrun.txt
            git commit -m "test(stage2): record disabled approval button visual dryrun" || true
            git push origin HEAD:fix/driver-approval-photo-rights-admin-filters-20261116
          fi
      - name: Require success
        run: grep -Fqx STAGE2_BUTTON_VISUAL_CI_SUCCESS reports/stage2_button_visual_dryrun.txt
