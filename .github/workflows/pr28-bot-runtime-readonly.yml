name: PRIVATE DRIVE - bot runtime management read only
on:
  push:
    branches: [audit/selected-launch-updates-20261116]
    paths:
      - ops/pr28_bot_runtime_readonly.py
      - .github/workflows/pr28-bot-runtime-readonly.yml
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check PythonAnywhere bot task/control capability GET only
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          python ops/pr28_bot_runtime_readonly.py > reports/pr28_bot_runtime.txt
      - name: Save sanitized details
        if: always()
        run: |
          if [ -f reports/pr28_bot_runtime.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/pr28_bot_runtime.txt
            git commit -m "audit: bot runtime management checks" || true
            git push origin HEAD:audit/selected-launch-updates-20261116
          fi
