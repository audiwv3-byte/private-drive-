name: QA42 isolated device runtime
on:
  push:
    branches: [qa/qa42-device-runtime]
permissions:
  contents: read
jobs:
  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - name: Prepare disposable Android project
        run: |
          flutter create --platforms=android --org=lt.privatedrive.qa --project-name=private_drive qa_android
          cp -R flutter_app/lib/. qa_android/lib/
          cp -R flutter_app/assets flutter_app/integration_test qa_android/
          cp flutter_app/pubspec.yaml qa_android/
          python3 ops/qa/prepare_android_release.py qa_android
          cp flutter_app/pubspec.yaml qa_android/
          cd qa_android
          flutter pub get
      - name: Enable runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          script: |
            adb shell pm list packages
            adb emu geo fix 25.2797 54.6872
            cd qa_android
            flutter build apk --debug --target=integration_test/qa42_device_runtime_test.dart --dart-define=PD_NATIVE_AUTH_API_URL=https://qa.invalid
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm grant lt.privatedrive.qa.private_drive android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant lt.privatedrive.qa.private_drive android.permission.ACCESS_COARSE_LOCATION
            flutter test integration_test/qa42_device_runtime_test.dart -d emulator-5554 --dart-define=PD_NATIVE_AUTH_API_URL=https://qa.invalid --reporter expanded
  ios-runtime:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - name: Boot disposable simulator and exercise native runtime
        working-directory: flutter_app
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for k,ds in json.load(sys.stdin)["devices"].items() if "iOS" in k for d in ds if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          flutter pub get
          flutter build ios --simulator --debug --no-codesign --target=integration_test/qa42_device_runtime_test.dart --dart-define=PD_NATIVE_AUTH_API_URL=https://qa.invalid
          APP=build/ios/iphonesimulator/Runner.app
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl privacy "$DEVICE" grant location "$BUNDLE"
          xcrun simctl location "$DEVICE" set 54.6872,25.2797
          flutter test integration_test/qa42_device_runtime_test.dart -d "$DEVICE" --dart-define=PD_NATIVE_AUTH_API_URL=https://qa.invalid --reporter expanded
  postgres-https:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: private_drive_test
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d private_drive_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PD_AUTH_TEST_DATABASE_URL: postgresql://postgres:isolated-test@127.0.0.1:5432/private_drive_test
      PD_NATIVE_SMS_ISOLATED: 'YES'
      PD_NATIVE_SMS_LIVE: 'NO'
      PD_PAYMENT_MODE: disabled
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: python -m pip install -r requirements-sms-render.txt flask pytest
      - run: flutter pub get
        working-directory: flutter_app
      - name: Allow loopback HTTPS on ephemeral runner
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      - name: Verify real HTTPS order and assignment with isolated PostgreSQL
        run: python -m pytest -vs tests/test_qa39_1_server_cabins.py
