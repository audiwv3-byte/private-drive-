name: PRIVATE DRIVE - audit dispatcher-only navigation
on:
  push:
    branches: [fix/dispatcher-no-client-switch-20261109]
    paths:
      - ops/dispatcher-nav-20261109/audit.py
      - .github/workflows/audit-dispatcher-nav-20261109.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install requests
      - name: Inspect only live dispatcher navigation
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: python ops/dispatcher-nav-20261109/audit.py
