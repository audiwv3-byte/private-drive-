name: PRIVATE DRIVE - stage2 independent postrelease verification
on:
  push:
    branches: [fix/driver-approval-photo-rights-admin-filters-20261116]
    paths:
      - ops/stage2_postrelease_independent_readonly.py
      - .github/workflows/stage2-postrelease-independent.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact HTML SHA and public page via GET only
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          python ops/stage2_postrelease_independent_readonly.py > reports/stage2_postrelease_independent.txt
      - name: Record sanitized verification
        if: always()
        run: |
          if [ -f reports/stage2_postrelease_independent.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/stage2_postrelease_independent.txt
            git commit -m "audit: verify deployed stage2 live HTML and public content" || true
            git push origin HEAD:fix/driver-approval-photo-rights-admin-filters-20261116
          fi
