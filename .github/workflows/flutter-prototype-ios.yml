name: PRIVATE DRIVE Flutter iOS unsigned prototype

on:
  push:
    branches:
      - feature/flutter-independent-auth
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-prototype-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-unsigned:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out isolated feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create standalone iOS Flutter scaffold
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=ios --org=lt.privatedrive --project-name=private_drive private_drive_build
          cp flutter_app/lib/main.dart private_drive_build/lib/main.dart
          rm -f private_drive_build/test/widget_test.dart

      - name: Analyze isolated iOS prototype
        working-directory: private_drive_build
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Build iOS Simulator (no signing)
        working-directory: private_drive_build
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --simulator --debug

      - name: Build unsigned iOS device app (no signing)
        working-directory: private_drive_build
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
