name: PRIVATE DRIVE - read only live approval and filter compatibility
on:
  push:
    branches: [fix/driver-approval-photo-rights-admin-filters-20261116]
    paths:
      - ops/driver_approval_dispatch_live_audit.py
      - .github/workflows/driver-approval-live-readonly.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: GET sources only, hashes and code anchors only
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          python ops/driver_approval_dispatch_live_audit.py > reports/driver_approval_dispatch_live_compat.txt
      - name: Save sanitized report
        if: always()
        run: |
          if [ -f reports/driver_approval_dispatch_live_compat.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/driver_approval_dispatch_live_compat.txt
            git commit -m "audit: verified active live driver approval source hashes" || true
            git push origin HEAD:fix/driver-approval-photo-rights-admin-filters-20261116
          fi
