name: PRIVATE DRIVE - PayPal production read-only compatibility audit
on:
  push:
    branches: [ops/paypal-readonly-live-audit-20261116]
    paths:
      - ops/pd_paypal_live_audit.py
      - .github/workflows/pd-paypal-live-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile ops/pd_paypal_live_audit.py
      - name: Inspect production code in read-only mode (never read .env)
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python ops/pd_paypal_live_audit.py
