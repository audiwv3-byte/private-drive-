name: PRIVATE DRIVE permanent Flutter iOS unsigned CI

on:
  push:
    branches:
      - feature/flutter-independent-auth
      - feature/website-private-drive-preview
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ios-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-unsigned:
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify committed iOS project and safe metadata
        run: |
          set -euo pipefail
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner/Info.plist
          test -f ios/Runner.xcworkspace/contents.xcworkspacedata
          test -f pubspec.yaml
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = lt.privatedrive.privateDrive;' ios/Runner.xcodeproj/project.pbxproj
          grep -Fq '<string>PRIVATE DRIVE</string>' ios/Runner/Info.plist
          grep -Eq '^version: [0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$' pubspec.yaml
          test ! -e ios/Flutter/Generated.xcconfig
          test ! -e ios/Flutter/flutter_export_environment.sh
          echo "Committed iOS project verified: PRIVATE DRIVE / $(grep '^version:' pubspec.yaml)"

      - name: Generate the same original transparent PD logo used by Android
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          source = Path("assets/brand/private_drive_logo.webp")
          assert hashlib.sha256(source.read_bytes()).hexdigest() == "550d3b75e1a50fc4feb4d34bec1727c7dd0f6a947f94e16295b834abbfbde35f"
          image = Image.open(source).convert("RGB")
          rgba = image.convert("RGBA")
          rgb, px = image.load(), rgba.load()
          for y in range(image.height):
              for x in range(image.width):
                  red, green, blue = rgb[x, y]
                  t = min(1.0, max(0.0, (max(red, green, blue) - 25.0) / 70.0))
                  px[x, y] = (red, green, blue, round(255 * t * t * (3 - 2 * t)))
          dest = Path("assets/brand/private_drive_logo_transparent.png")
          rgba.save(dest, format="PNG", optimize=True)
          assert rgba.getpixel((0, 0))[3] == 0
          pubspec = Path("pubspec.yaml")
          source_text = pubspec.read_text()
          marker = "    - assets/brand/private_drive_logo.webp"
          assert source_text.count(marker) == 1
          pubspec.write_text(source_text.replace(marker,
            marker + chr(10) + "    - assets/brand/private_drive_logo_transparent.png"))
          assert dest.stat().st_size > 10000
          PY

      - name: Resolve packages, analyze and compile unsigned iOS Debug
        run: |
          set -euo pipefail
          flutter pub get
          flutter test --no-pub
          flutter analyze --no-fatal-infos
          flutter build ios --debug --no-codesign

      - name: Upload unsigned Debug artifact (not installable)
        uses: actions/upload-artifact@v4
        with:
          name: private-drive-ios-unsigned-debug
          path: flutter_app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7

      - name: Compile unsigned iOS Release (not distributable)
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign

      - name: Upload unsigned Release artifact (not installable)
        uses: actions/upload-artifact@v4
        with:
          name: private-drive-ios-unsigned-release
          path: flutter_app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
