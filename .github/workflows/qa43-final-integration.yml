name: QA43 final isolated integration and device packages
on:
  push:
    branches: [qa/qa43-final-integration]
permissions:
  contents: read
concurrency:
  group: private-drive-qa43
  cancel-in-progress: true
jobs:
  browser-https:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: private_drive_test
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d private_drive_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PD_QA42_LOCAL: '1'
      PD_AUTH_TEST_DATABASE_URL: postgresql://postgres:isolated-test@127.0.0.1:5432/private_drive_test
      PD_NATIVE_SMS_LIVE: 'NO'
      PD_PAYMENT_MODE: disabled
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-sms-render.txt flask pytest playwright
      - run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          python -m playwright install --with-deps chromium
      - name: Prepare offline map assets
        run: |
          for asset in leaflet.js leaflet.css; do
            curl --fail --silent --show-error --retry 3 "https://unpkg.com/leaflet@1.9.4/dist/$asset" -o "$asset"
          done
      - run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      - run: python -m pytest -vs tests/test_qa42_device_session_gps.py
  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - name: Verify native HTTPS, session and order contracts
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter test test/pd_http_api_test.dart test/native_orders_api_test.dart test/native_pilot_orders_test.dart test/qa39_gps_test.dart --no-pub --dart-define=PD_NATIVE_AUTH_API_URL=https://qa.invalid
      - name: Prepare disposable Android project
        run: |
          flutter create --platforms=android --org=lt.privatedrive.qa --project-name=private_drive qa_android
          cp -R flutter_app/lib/. qa_android/lib/
          cp -R flutter_app/assets flutter_app/integration_test qa_android/
          cp flutter_app/pubspec.yaml qa_android/
          if test -f flutter_app/pubspec.lock; then cp flutter_app/pubspec.lock qa_android/; fi
          python3 ops/qa/prepare_android_release.py qa_android
          cp flutter_app/pubspec.yaml qa_android/
          cd qa_android
          flutter pub get
      - name: Enable runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          script: |
            cd qa_android && flutter build apk --debug --target=integration_test/qa42_device_runtime_test.dart --dart-define=PD_NATIVE_AUTH_API_URL=https://qa.invalid
            adb install -r qa_android/build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm grant lt.privatedrive.qa.private_drive android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant lt.privatedrive.qa.private_drive android.permission.ACCESS_COARSE_LOCATION
            bash ops/qa/qa42_android_runtime.sh
  android-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PD_NATIVE_SMS_LIVE: "NO"
      PD_PAYMENT_MODE: disabled
      QA_API_URL: https://qa.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Verify fail-closed QA endpoint
        run: test "$QA_API_URL" = https://qa.invalid
      - name: Generate isolated Android scaffold
        run: |
          flutter create --platforms=android --org=lt.privatedrive.qa --project-name=private_drive qa_android
          cp -R flutter_app/lib/. qa_android/lib/
          cp -R flutter_app/assets qa_android/assets
          cp flutter_app/pubspec.yaml qa_android/
          if test -f flutter_app/pubspec.lock; then cp flutter_app/pubspec.lock qa_android/; fi
          python3 ops/qa/prepare_android_release.py qa_android
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 30 -dname "CN=PRIVATE DRIVE isolated QA,O=QA,C=LT"
      - name: Build APK and AAB with one ephemeral QA key
        working-directory: qa_android
        run: |
          flutter pub get
          flutter pub deps --json > "$RUNNER_TEMP/qa43-deps.json"
          flutter build apk --release --no-pub --dart-define="PD_NATIVE_AUTH_API_URL=$QA_API_URL" --dart-define=PD_INTERNAL_QA=false --dart-define=PD_QA28_GPS=false --dart-define=PD_QA_IOS_GPS=false --dart-define=PD_QA29_LOOPBACK=false --dart-define=PD_ISOLATED_WEB_PREVIEW=false
          flutter build appbundle --release --no-pub --dart-define="PD_NATIVE_AUTH_API_URL=$QA_API_URL" --dart-define=PD_INTERNAL_QA=false --dart-define=PD_QA28_GPS=false --dart-define=PD_QA_IOS_GPS=false --dart-define=PD_QA29_LOOPBACK=false --dart-define=PD_ISOLATED_WEB_PREVIEW=false
          test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Verify APK signature, manifest, and package identity
        run: |
          SDK_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK=qa_android/build/app/outputs/flutter-apk/app-release.apk
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$SDK_TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='lt.privatedrive.qa.private_drive'" "$RUNNER_TEMP/badging.txt"
          grep -Fx "targetSdkVersion:'36'" "$RUNNER_TEMP/badging.txt"
          mkdir -p qa_apk
          cp "$APK" qa_apk/PRIVATE-DRIVE-QA43-ONLY.apk
          cp "$RUNNER_TEMP/badging.txt" qa_apk/
          (cd qa_apk && sha256sum PRIVATE-DRIVE-QA43-ONLY.apk > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: private-drive-qa43-apk-not-for-store
          path: qa_apk/
          retention-days: 14
      - name: Validate AAB signature, manifest, and SDK
        run: |
          jarsigner -verify qa_android/build/app/outputs/bundle/release/app-release.aab
          curl --fail --silent --show-error --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=qa_android/build/app/outputs/bundle/release/app-release.aab
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=qa_android/build/app/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/manifest.xml"
          python3 ops/qa/check_android_release.py "$RUNNER_TEMP/manifest.xml"
          mkdir -p qa_aab
          cp qa_android/build/app/outputs/bundle/release/app-release.aab qa_aab/PRIVATE-DRIVE-QA-ONLY.aab
          cp "$RUNNER_TEMP/manifest.xml" qa_aab/manifest.xml
          cp "$RUNNER_TEMP/qa43-deps.json" qa_aab/dependencies.json
          (cd qa_aab && sha256sum PRIVATE-DRIVE-QA-ONLY.aab > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: private-drive-qa43-aab-not-for-store
          path: qa_aab/
          retention-days: 14
  ios-device-release:
    runs-on: macos-15
    env:
      QA_API_URL: https://qa.invalid
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Verify fail-closed QA endpoint
        run: test "$QA_API_URL" = https://qa.invalid
      - name: Build arm64 device Release without signing
        working-directory: flutter_app
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 -c 'from pathlib import Path; p=Path("pubspec.yaml"); s=p.read_text(); old="  integration_test:\n    sdk: flutter\n"; assert s.count(old)==1; p.write_text(s.replace(old,""))'
          flutter pub get
          flutter pub deps --json > "$RUNNER_TEMP/qa43-deps.json"
          test -s "$RUNNER_TEMP/qa43-deps.json"
          flutter build ios --release --no-codesign --no-pub --dart-define="PD_NATIVE_AUTH_API_URL=$QA_API_URL" --dart-define=PD_INTERNAL_QA=false --dart-define=PD_QA28_GPS=false --dart-define=PD_QA_IOS_GPS=false --dart-define=PD_QA29_LOOPBACK=false --dart-define=PD_ISOLATED_WEB_PREVIEW=false
      - name: Validate device binary and packaged privacy configuration
        run: |
          plutil -lint flutter_app/build/ios/iphoneos/Runner.app/Info.plist
          plutil -lint flutter_app/build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' flutter_app/build/ios/iphoneos/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print CFBundleVersion' flutter_app/build/ios/iphoneos/Runner.app/Info.plist
          python3 ops/qa/check_ios_qa41_release.py flutter_app/build/ios/iphoneos/Runner.app
          mkdir -p qa_ios
          cp "$RUNNER_TEMP/qa43-deps.json" qa_ios/dependencies.json
          cp flutter_app/build/ios/iphoneos/Runner.app/Info.plist qa_ios/
          cp flutter_app/build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy qa_ios/
          ditto -c -k --keepParent flutter_app/build/ios/iphoneos/Runner.app qa_ios/PRIVATE-DRIVE-QA-UNSIGNED.zip
          (cd qa_ios && shasum -a 256 PRIVATE-DRIVE-QA-UNSIGNED.zip > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: private-drive-qa43-ios-unsigned-not-for-store
          path: qa_ios/
          retention-days: 14
