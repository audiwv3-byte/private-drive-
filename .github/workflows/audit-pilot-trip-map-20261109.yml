name: PRIVATE DRIVE - audit pilot trip map full-screen
on:
  push:
    branches: [fix/pilot-trip-map-fullscreen-20261109]
    paths:
      - ops/pilot-trip-map-20261109/audit.py
      - .github/workflows/audit-pilot-trip-map-20261109.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - name: Read live driver and map source, no orders or writes
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: python ops/pilot-trip-map-20261109/audit.py
