name: Render PRIVATE DRIVE with approved Rex voice
on:
  push:
    branches:
      - render/approved-rex-broadcaster-20261106
    paths:
      - .github/workflows/render-rex-private-drive.yml
permissions:
  contents: read
jobs:
  mux:
    name: FFmpeg verified approved audio and video
    if: github.ref == 'refs/heads/render/approved-rex-broadcaster-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Provide standalone FFmpeg without apt
        run: |
          python -m pip install --quiet --user imageio-ffmpeg
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/.local/bin/ffmpeg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Get approved Rex Broadcaster audio and existing master visuals
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 'https://resource2.heygen.ai/video/da55ab47231e4fe3993e3d7c5a47963c/original.mp4' -o video.mp4
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 'https://resource2.heygen.ai/text_to_speech/94f4b62ce18a4a77b5498aa84f1e4225/f80e430f06b34b70b275c9c746436e37/id%3D7a85503f-293a-42a5-a8be-35c4c1dbeffc.mp3' -o rex.mp3
          ffmpeg -hide_banner -v error -i rex.mp3 -t 0.1 -f null -
          ffmpeg -hide_banner -v error -i video.mp4 -t 0.1 -f null -
      - name: Master new MP4, no voice substitution, and validate output
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -v warning -y -i video.mp4 -itsoffset 0.55 -i rex.mp3 \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -ar 48000 \
            -af "loudnorm=I=-16:TP=-1.5:LRA=11" \
            -t 7.75 -movflags +faststart 'PRIVATE_DRIVE_Rex_Broadcaster_approved.mp4'
          test -s PRIVATE_DRIVE_Rex_Broadcaster_approved.mp4
          ffmpeg -hide_banner -i PRIVATE_DRIVE_Rex_Broadcaster_approved.mp4 -t 0.1 -f null - 2>&1 | tee probe.log
          grep -q 'Audio: aac' probe.log
          ffmpeg -hide_banner -i PRIVATE_DRIVE_Rex_Broadcaster_approved.mp4 -map 0:a -af volumedetect -f null - 2>&1 | grep 'mean_volume'
          sha256sum PRIVATE_DRIVE_Rex_Broadcaster_approved.mp4
      - name: Save finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: PRIVATE_DRIVE_Approved_Rex_MP4
          path: PRIVATE_DRIVE_Rex_Broadcaster_approved.mp4
          retention-days: 30
          if-no-files-found: error
