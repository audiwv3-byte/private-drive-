name: PRIVATE DRIVE isolated no-payment QA

on:
  push:
    branches:
      - feature/native-dispatch-integration-no-payments
      - fix/unified-orders-staging-20261126
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assignment-postgres:
    if: github.ref == 'refs/heads/feature/native-dispatch-integration-no-payments' || github.ref == 'refs/heads/fix/unified-orders-staging-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: private_drive_test
          POSTGRES_USER: pd_assignment_owner
          POSTGRES_PASSWORD: synthetic-only
        ports: ["55442:5432"]
        options: >-
          --health-cmd "pg_isready -U pd_assignment_owner -d private_drive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PD_CI_FAKE_DB_ONLY: 'YES'
      PD_SYNTHETIC_ASSIGNMENT_DATABASE_URL: 'postgresql://pd_assignment_owner:synthetic-only@127.0.0.1:55442/private_drive_test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify assignment against disposable PostgreSQL only
        run: |
          test "$PD_CI_FAKE_DB_ONLY" = YES
          test -n "$PD_SYNTHETIC_ASSIGNMENT_DATABASE_URL"
          python -m pip install pytest -r requirements-dispatcher-staging.txt -r requirements.txt
          python -m pytest -q tests/test_native_pilot_assignment_postgres.py

  build-android-release:
    if: github.ref == 'refs/heads/feature/native-dispatch-integration-no-payments' || github.ref == 'refs/heads/fix/unified-orders-staging-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pd_schema_ci
          POSTGRES_USER: pd_ci
          POSTGRES_PASSWORD: synthetic-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pd_ci -d pd_schema_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PD_CI_FAKE_DB_ONLY: 'YES'
      PD_CI_POSTGRES_URL: 'postgresql://pd_ci:synthetic-only-password@127.0.0.1:5432/pd_schema_ci'
    steps:
      - uses: actions/checkout@v4
      - name: Read explicit isolated pilot build manifest
        id: pilot
        shell: bash
        run: |
          connected=false
          if [[ -f flutter_app/tool/connected-pilot-apk.txt ]]; then
            [[ "$(cat flutter_app/tool/connected-pilot-apk.txt)" == 'staging-only-no-payments' ]]
            connected=true
          fi
          echo "PD_CONNECTED_PILOT_APK=$connected" >> "$GITHUB_ENV"
          echo "connected=$connected" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Create isolated Android Flutter scaffold
        run: |
          flutter create --platforms=android --org=lt.privatedrive --project-name=private_drive private_drive_build
          cp -R flutter_app/lib/. private_drive_build/lib/
          cp -R flutter_app/assets private_drive_build/assets
          # Install Pillow BEFORE starting the Python interpreter.
          # Installing it from inside a running Python process leaves its
          # newly created user-site path unavailable to that same process.
          python3 -m pip install --quiet Pillow
          # The exact, approved 1254px lossless asset is used by Flutter,
          # the Android launcher, and the native launch background.
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import re
          source = Path("flutter_app/assets/brand/private_drive_logo.webp")
          data = source.read_bytes()
          expected = "550d3b75e1a50fc4feb4d34bec1727c7dd0f6a947f94e16295b834abbfbde35f"
          assert hashlib.sha256(data).hexdigest() == expected, "approved logo hash mismatch"
          assert data[:4] == b"RIFF" and data[8:16] == b"WEBPVP8L"
          assert len(data) > 1000000, "approved full resolution asset missing"
          android = Path("private_drive_build/android/app/src/main")
          drawable = android / "res/drawable-nodpi"
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / "private_drive_logo.webp").write_bytes(data)
          # Keep the original brand image for the launcher and Flutter.
          # Android's native bitmap drawable is not fit-center scaled on
          # narrow phones; the old 1254px artwork could be clipped.
          # Generate a smaller lossless native splash image with margins.
          import io
          from PIL import Image
          with Image.open(io.BytesIO(data)) as source_image:
              source_image.thumbnail((720, 720), Image.Resampling.LANCZOS)
              splash = io.BytesIO()
              source_image.save(splash, format="WEBP", lossless=True)
          (drawable / "private_drive_splash_logo.webp").write_bytes(splash.getvalue())
          assert source_image.width <= 720 and source_image.height <= 720
          # The Flutter entry screen uses exactly the same approved image.
          assert len(data) >= 3000
          launch = """<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/black" />
              <item>
                  <bitmap android:gravity="center" android:src="@drawable/private_drive_splash_logo" />
              </item>
          </layer-list>
          """
          for dirname in ("drawable", "drawable-v21"):
              folder = android / f"res/{dirname}"
              folder.mkdir(parents=True, exist_ok=True)
              (folder / "launch_background.xml").write_text(launch)
          manifest = android / "AndroidManifest.xml"
          text = manifest.read_text()
          assert 'android:icon="@mipmap/ic_launcher"' in text
          # Keep the agreed customer-facing name in every isolated build.
          # Adaptive launcher artwork is generated from the approved source,
          # with Android's circular launcher mask safe area respected.
          assert 'android:label="private_drive"' in text
          text = text.replace('android:label="private_drive"',
                              'android:label="PRIVATE DRIVE"')
          manifest.write_text(text)
          from PIL import Image, ImageOps
          with Image.open(source) as approved:
              art = approved.convert("RGBA")
              assert art.width == art.height, "approved launcher art must be square"
              for density, dimension in (("mdpi", 48), ("hdpi", 72),
                                         ("xhdpi", 96), ("xxhdpi", 144),
                                         ("xxxhdpi", 192)):
                  folder = android / f"res/mipmap-{density}"
                  folder.mkdir(parents=True, exist_ok=True)
                  # Legacy round launchers crop corners; keep the artwork
                  # inside a safe centered square instead of crop-to-fill.
                  canvas = Image.new("RGBA", (dimension, dimension), (0, 0, 0, 255))
                  inset = int(dimension * 0.14)
                  content = ImageOps.contain(
                      art, (dimension - 2 * inset, dimension - 2 * inset),
                      method=Image.Resampling.LANCZOS)
                  canvas.alpha_composite(content, ((dimension-content.width)//2,
                                                   (dimension-content.height)//2))
                  canvas.convert("RGB").save(folder / "ic_launcher.png")
              foreground = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
              # Adaptive icon visible mask is the central 2/3: artwork
              # stays within it with extra clearance from the perimeter.
              fitted = ImageOps.contain(art, (264, 264),
                                       method=Image.Resampling.LANCZOS)
              foreground.alpha_composite(fitted, ((432-fitted.width)//2,
                                                  (432-fitted.height)//2))
              foreground.save(drawable / "private_drive_adaptive_foreground.png")
          values = android / "res/values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "private_drive_launcher_colors.xml").write_text(
              '<resources><color name="pd_launcher_background">#000000</color></resources>')
          adaptive = android / "res/mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          (adaptive / "ic_launcher.xml").write_text(
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">'
              '<background android:drawable="@color/pd_launcher_background"/>'
              '<foreground android:drawable="@drawable/private_drive_adaptive_foreground"/>'
              '</adaptive-icon>')
          assert 'android:icon="@mipmap/ic_launcher"' in manifest.read_text()
          assert 'android:label="PRIVATE DRIVE"' in manifest.read_text()
          if os.environ.get("PD_CONNECTED_PILOT_APK") == "true":
              # Stay installable beside the existing app, without touching
              # its package or device storage.
              gradle = android.parent.parent / "build.gradle.kts"
              data, replacements = re.subn(
                  r'(?m)^([ ]*)applicationId\s*=\s*"lt\.privatedrive\.private_drive"',
                  r'\1applicationId = "lt.privatedrive.private_drive.pilot"',
                  gradle.read_text(),
              )
              assert replacements == 1, "could not safely set separate pilot app ID"
              gradle.write_text(data)
          assert '@mipmap/ic_launcher' in manifest.read_text()
          print(f"Approved brand verified ({len(data)} bytes), adaptive launcher and splash installed")
          PY
          python3 flutter_app/tool/apply_native_brand_splash.py
          cp -R flutter_app/test/. private_drive_build/test/
          cp -R flutter_app/integration_test private_drive_build/integration_test
          cp flutter_app/pubspec.yaml private_drive_build/pubspec.yaml
          # The generated transparent artwork is shared by native sign-in and
          # the pilot's offline go-online screen, never by the launcher icon.
          # Ensure Pillow exists in this Python context before generating it.
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          source = Path("flutter_app/assets/brand/private_drive_logo.webp")
          assert hashlib.sha256(source.read_bytes()).hexdigest() == "550d3b75e1a50fc4feb4d34bec1727c7dd0f6a947f94e16295b834abbfbde35f"
          image = Image.open(source).convert("RGB")
          rgba = image.convert("RGBA")
          rgb = image.load()
          px = rgba.load()
          for y in range(image.height):
              for x in range(image.width):
                  red, green, blue = rgb[x, y]
                  strength = max(red, green, blue)
                  t = min(1.0, max(0.0, (strength - 25.0) / 70.0))
                  opacity = round(255 * t * t * (3 - 2 * t))
                  px[x, y] = (red, green, blue, opacity)
          dest = Path("private_drive_build/assets/brand/private_drive_logo_transparent.png")
          rgba.save(dest, format="PNG", optimize=True)
          assert rgba.getpixel((0, 0))[3] == 0, "black backdrop must be transparent"
          assert rgba.getpixel((image.width // 2, image.height // 2))[3] > 0, "gold artwork must remain visible"
          pubspec = Path("private_drive_build/pubspec.yaml")
          contents = pubspec.read_text()
          marker = "    - assets/brand/private_drive_logo.webp"
          assert contents.count(marker) == 1
          pubspec.write_text(contents.replace(marker,
              marker + chr(10) + "    - assets/brand/private_drive_logo_transparent.png"))
          assert dest.stat().st_size > 10000
          print(f"Original logo unchanged; sign-in transparency ready: {dest.stat().st_size} bytes")
          PY
          cp flutter_app/analysis_options.yaml private_drive_build/analysis_options.yaml
          rm -f private_drive_build/test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("private_drive_build/android/app/src/main/AndroidManifest.xml")
          data = manifest.read_text()
          assert "<manifest" in data and "<application" in data
          insert = ('    <uses-permission android:name="android.permission.INTERNET"/>\\n'
                    '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\\n'
                    '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\\n'
                    '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\\n'
                    '    <uses-permission android:name="android.permission.CAMERA"/>\\n'
                    '    <uses-feature android:name="android.hardware.camera" android:required="false"/>\\n'
                    '    <queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>\\n')
          insert = insert.replace('\\n', '\n')
          data = data.replace("<application", insert + "    <application", 1)
          manifest.write_text(data)
          PY
      - name: Verify two isolated HTTP chat sessions and message delivery
        run: |
          python3 -m unittest discover -s test_sync_server -p 'test_*.py' -v
      - name: Python syntax and isolated tests
        run: |
          python3 -m pip install pytest -r requirements-dispatcher-staging.txt -r requirements.txt
          python3 -m py_compile pd_native_orders_http.py pd_dispatch_persistent.py isolated_sms_wsgi.py pd_dispatcher_staging_wsgi.py pd_miniapp_dispatch_bridge.py miniapp_server.py
          python3 -m pytest -q tests/test_miniapp_dispatch_bridge.py
          python3 -m pytest -q tests/test_native_dispatch_payment_guard.py tests/test_native_dispatch_postgres.py
          python3 -m pytest -q tests/test_native_staging_compatibility_gate.py
          python3 -m unittest -v test_web_dispatcher.py test_dispatcher_staging_wsgi.py
      - name: Flutter tests and debug APK
        working-directory: private_drive_build
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          # No URL can be supplied by a workflow caller. Only the exact QA
          # branch and explicit tracked manifest can build a connected APK.
          # This job never contacts Render or deploys services.
          base_url=https://example.invalid
          if [[ "$PD_CONNECTED_PILOT_APK" == true ]]; then
            base_url=https://private-drive-drbd.onrender.com
          fi
          # Enable pilot orders in connected internal QA builds only.
          flutter build apk --debug \
            --dart-define="PD_NATIVE_AUTH_API_URL=$base_url" \
            --dart-define="PD_NATIVE_PILOT_ASSIGNMENT=$PD_CONNECTED_PILOT_APK" \
            --dart-define="PD_WEB_DISPATCH_ONLY=true" \
            --dart-define="PD_QUICK_RESUME=true"
          # Inspect the actual built APK, not just its source manifest.
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          unzip -tq "$apk"
          aapt_bin="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          "$aapt_bin" dump badging "$apk" > ../private_drive_apk_badging.txt
          if [[ "$PD_CONNECTED_PILOT_APK" == true ]]; then
            grep -Fq "package: name='lt.privatedrive.private_drive.pilot'" ../private_drive_apk_badging.txt
          else
            grep -Fq "package: name='lt.privatedrive.private_drive'" ../private_drive_apk_badging.txt
          fi
          grep -Fq "application-label:'PRIVATE DRIVE'" ../private_drive_apk_badging.txt
          apksigner_bin="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_bin"
          "$apksigner_bin" verify "$apk"
          mkdir -p ../private_drive_qa
          cp "$apk" ../private_drive_qa/private-drive-qa.apk
          cp ../private_drive_apk_badging.txt ../private_drive_qa/APK_BADGING.txt
          cd ../private_drive_qa
          sha256sum private-drive-qa.apk > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pilot.outputs.connected == 'true' && 'private-drive-connected-pilot-internal-debug-apk' || 'private-drive-offline-qa-apk' }}
          path: private_drive_qa/
          if-no-files-found: error
          retention-days: 7
