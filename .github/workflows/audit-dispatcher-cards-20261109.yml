name: PRIVATE DRIVE - audit protected dispatcher passenger cards
on:
  push:
    branches: [audit/dispatcher-passenger-card-20261109]
    paths:
      - .github/workflows/audit-dispatcher-cards-20261109.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install requests
      - name: Inspect code and unauthenticated access only - no customer data
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: python ops/dispatcher-cards-20261109/audit_live.py
