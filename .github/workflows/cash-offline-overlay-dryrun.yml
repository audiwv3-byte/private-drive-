name: PRIVATE DRIVE - new bookings no cash offline overlay
on:
  push:
    branches: [audit/selected-launch-updates-20261116]
    paths:
      - ops/cash_offline_overlay_dryrun.py
      - .github/workflows/cash-offline-overlay-dryrun.yml
permissions:
  contents: write
jobs:
  dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline patch candidate only - production API GET
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          if python ops/cash_offline_overlay_dryrun.py > reports/cash_offline_overlay.txt; then
            echo 'CASH_OFFLINE_OVERLAY_PASS' >> reports/cash_offline_overlay.txt
          else
            echo 'CASH_OFFLINE_OVERLAY_BLOCK' >> reports/cash_offline_overlay.txt
          fi
      - name: Save sanitized status
        if: always()
        run: |
          if [ -f reports/cash_offline_overlay.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/cash_offline_overlay.txt
            git commit -m "test: cash-only new booking overlay gates" || true
            git push origin HEAD:audit/selected-launch-updates-20261116
          fi
      - name: Enforce safe offline patch
        run: grep -Fqx 'CASH_OFFLINE_OVERLAY_PASS' reports/cash_offline_overlay.txt
