name: PRIVATE DRIVE Flutter widget tests and static analysis (Linux)

on:
  push:
    branches:
      - feature/flutter-independent-auth
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-linux-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flutter_app
    env:
      PD_NATIVE_AUTH_API_URL: ''
    steps:
      - name: Checkout feature source
        uses: actions/checkout@v4
      - name: Install stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify offline test environment
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f test/offline_auth_test.dart
          test -z "${PD_NATIVE_AUTH_API_URL}"
          echo "PRIVATE DRIVE offline checks: no real OTP or production API configured"
      - name: Generate the same original transparent PD logo used by Android
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          source = Path("assets/brand/private_drive_logo.webp")
          assert hashlib.sha256(source.read_bytes()).hexdigest() == "550d3b75e1a50fc4feb4d34bec1727c7dd0f6a947f94e16295b834abbfbde35f"
          image = Image.open(source).convert("RGB")
          rgba = image.convert("RGBA")
          rgb, px = image.load(), rgba.load()
          for y in range(image.height):
              for x in range(image.width):
                  red, green, blue = rgb[x, y]
                  t = min(1.0, max(0.0, (max(red, green, blue) - 25.0) / 70.0))
                  px[x, y] = (red, green, blue, round(255 * t * t * (3 - 2 * t)))
          dest = Path("assets/brand/private_drive_logo_transparent.png")
          rgba.save(dest, format="PNG", optimize=True)
          assert rgba.getpixel((0, 0))[3] == 0
          pubspec = Path("pubspec.yaml")
          source_text = pubspec.read_text()
          marker = "    - assets/brand/private_drive_logo.webp"
          assert source_text.count(marker) == 1
          pubspec.write_text(source_text.replace(marker,
            marker + chr(10) + "    - assets/brand/private_drive_logo_transparent.png"))
          assert dest.stat().st_size > 10000
          PY
      - name: Fetch Dart packages
        run: flutter pub get
      - name: Run widget tests without backend or SMS
        run: flutter test --no-pub --reporter expanded
      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos
