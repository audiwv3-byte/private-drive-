name: PRIVATE DRIVE - read-only onboarding audit
on:
  push:
    branches: [fix/restore-first-language-telegram-onboarding-20261109]
    paths:
      - ops/onboarding-restore-20261109/audit_live.py
      - .github/workflows/onboarding-live-audit-20261109.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - name: Read-only audit of current live first screen and JavaScript
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: python ops/onboarding-restore-20261109/audit_live.py
