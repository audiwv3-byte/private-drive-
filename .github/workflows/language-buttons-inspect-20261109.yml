name: PRIVATE DRIVE - inspect language buttons (read only)
# corrected Python inspect-module name shadowing in prior runner
on:
  push:
    branches: [fix/welcome-language-buttons-20261109]
    paths:
      - ops/language-buttons-20261109/pd_style_audit.py
      - .github/workflows/language-buttons-inspect-20261109.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install requests
      - name: Inspect production styles without changing application
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: python ops/language-buttons-20261109/pd_style_audit.py
