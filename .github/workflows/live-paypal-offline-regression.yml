name: PRIVATE DRIVE - live PayPal offline regression
on:
  push:
    branches: [audit/postdeploy-paypal-gps-20261116]
    paths:
      - ops/live_paypal_offline_regression.py
      - .github/workflows/live-paypal-offline-regression.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate actual live PayPal module offline without any payment traffic
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          python ops/live_paypal_offline_regression.py > reports/live_paypal_offline_regression.txt
      - name: Record sanitized test outcomes
        if: always()
        run: |
          if [ -f reports/live_paypal_offline_regression.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/live_paypal_offline_regression.txt
            git commit -m "audit: save offline live PayPal checks" || true
            git push origin HEAD:audit/postdeploy-paypal-gps-20261116
          fi
