name: PRIVATE DRIVE unified staging API contract QA

on:
  push:
    branches:
      - qa/unified-staging-api-contract-20261126
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PD_PAYMENT_MODE: disabled
      PD_DISPATCH_STAGING_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies only
        run: python -m pip install Flask==3.0.3 Werkzeug==3.1.9
      - name: Check Python syntax without importing servers
        run: python -m py_compile pd_miniapp_dispatch_bridge.py pd_dispatch_persistent.py miniapp_server.py isolated_sms_wsgi.py pd_native_orders_http.py pd_native_pilot_assignment.py
      - name: Run isolated bridge and contract tests (no database or network)
        run: python -m unittest discover -s tests -p 'test_miniapp_dispatch_bridge.py' -v && python -m unittest discover -s tests -p 'test_staging_api_contract.py' -v
