name: PRIVATE DRIVE - test current production JS with mocks
on:
  push:
    branches: [audit/prelaunch-passenger-pilot-dispatch-20261106]
    paths:
      - ops/pa_prelaunch_live_mock.py
      - .github/workflows/prelaunch-live-mock.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - run: python -m py_compile ops/pa_prelaunch_live_mock.py
      - name: Test current live JavaScript locally without creating orders
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: python ops/pa_prelaunch_live_mock.py
