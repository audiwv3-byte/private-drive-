name: PRIVATE DRIVE - read-only passenger screen captures
on:
  push:
    branches: [ops/passenger-screen-previews-20261116]
    paths:
      - .github/workflows/passenger-previews.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python ops/capture_passenger_previews.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-drive-passenger-four-screens
          path: passenger_previews/*.png
          if-no-files-found: warn
