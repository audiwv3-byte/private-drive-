name: QA35 security
on:
  push:
    branches: [qa/qa35-security]
permissions:
  contents: read
jobs:
  identity-session:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: private_drive_test
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d private_drive_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PD_AUTH_TEST_DATABASE_URL: postgresql://postgres:isolated-test@127.0.0.1:5432/private_drive_test
      PD_IDENTITY_TEST_DATABASE_URL: postgresql://postgres:isolated-test@127.0.0.1:5432/private_drive_test
      PD_NATIVE_SMS_ISOLATED: 'YES'
      PD_NATIVE_SMS_LIVE: 'NO'
      PD_PAYMENT_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-sms-render.txt werkzeug pytest flask
      - run: python -m pytest -vs tests/test_qa35_documents.py tests/test_qa35_gps_acl.py
      - run: python -m unittest -v test_native_identity_http.py
      - run: |
          python -c "import os; from pd_native_auth_postgres_http import initialize_database; initialize_database(os.environ['PD_AUTH_TEST_DATABASE_URL'])"
          python -c "import os,psycopg; from pathlib import Path; c=psycopg.connect(os.environ['PD_AUTH_TEST_DATABASE_URL'],autocommit=True); c.execute(Path('migrations/native_auth_session_functions.sql').read_text()); c.close()"
          python -m unittest -v test_qa_postgres_session_security.py
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ops/qa/qa35_secret_scan.py --history
