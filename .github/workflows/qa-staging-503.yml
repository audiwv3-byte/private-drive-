name: QA staging API 503 synthetic PostgreSQL
on:
  push:
    branches: [qa/merged-passenger-gps-20261126]

permissions:
  contents: read

jobs:
  staging-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa
          POSTGRES_DB: private_drive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d private_drive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PD_QA_SYNTHETIC_POSTGRES_URL: postgresql://qa:qa@127.0.0.1:5432/private_drive_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated dependencies
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Check Python syntax of changed QA components
        run: python -m py_compile pd_qa_staging_preflight.py pd_qa25_wsgi.py pd_qa25_telegram_orders.py tests/test_qa_staging_preflight.py
      - name: Test synthetic PostgreSQL and all 503 conditions
        run: python -m unittest discover -s tests -p test_qa_staging_preflight.py -v

  shared-api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: private_drive_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d private_drive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated API dependencies
        run: python -m pip install -r requirements-sms-render.txt flask pytest
      - name: Test WSGI, Telegram, Android and dispatcher queue in synthetic PostgreSQL
        run: python -m pytest -v tests/test_qa25_wsgi.py
        env:
          PD_AUTH_TEST_DATABASE_URL: postgresql://postgres:isolated-test@127.0.0.1:5432/private_drive_test
          PD_PAYMENT_MODE: disabled
          PD_NATIVE_SMS_LIVE: 'NO'

  pilot-assignment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: private_drive_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d private_drive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated dependencies
        run: python -m pip install -r requirements-sms-render.txt flask pytest
      - name: Validate pilot-assignment contracts and PostgreSQL permissions
        run: python -m pytest -v tests/test_qa26_assignment.py
        env:
          PD_AUTH_TEST_DATABASE_URL: postgresql://postgres:isolated-test@127.0.0.1:5432/private_drive_test
          PD_PAYMENT_MODE: disabled
          PD_NATIVE_SMS_LIVE: 'NO'

  pilot-gps:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: private_drive_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d private_drive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated dependencies
        run: python -m pip install -r requirements-sms-render.txt flask pytest
      - name: Validate pilot-gps contracts and PostgreSQL permissions
        run: python -m pytest -v tests/test_qa27_gps.py
        env:
          PD_AUTH_TEST_DATABASE_URL: postgresql://postgres:isolated-test@127.0.0.1:5432/private_drive_test
          PD_PAYMENT_MODE: disabled
          PD_NATIVE_SMS_LIVE: 'NO'

  render-entrypoint-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated QA branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout observed native API deploy source (read-only)
        uses: actions/checkout@v4
        with:
          repository: audiwv3-byte/private-drive-
          ref: 0ed1e60482f30aa5039d7f0ef170144949a4e2ec
          path: .qa_snapshot/native_api
          persist-credentials: false
      - name: Checkout observed dispatcher deploy source (read-only)
        uses: actions/checkout@v4
        with:
          repository: audiwv3-byte/private-drive-
          ref: 44795f496ed05760cfc09474c506c6d7916c86fb
          path: .qa_snapshot/dispatcher
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit deployed WSGI contracts without network or database access
        run: python -m unittest discover -s tests -p test_qa_render_wsgi_contract.py -v

  native-orders-real-wsgi:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: private_drive_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d private_drive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated WSGI test dependencies
        run: python -m pip install -r requirements-sms-render.txt 'Flask==3.0.3' pytest
      - name: Exercise native orders through actual isolated WSGI and synthetic PostgreSQL
        run: python -m pytest -v tests/test_qa_native_orders_wsgi.py
        env:
          PD_AUTH_TEST_DATABASE_URL: postgresql://postgres:isolated-test@127.0.0.1:5432/private_drive_test
          PD_NATIVE_SMS_LIVE: 'NO'
          PD_PAYMENT_MODE: disabled

  native-dispatcher-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: private_drive_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d private_drive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout observed dispatcher WSGI at pinned deploy SHA
        uses: actions/checkout@v4
        with:
          repository: audiwv3-byte/private-drive-
          ref: 44795f496ed05760cfc09474c506c6d7916c86fb
          path: .qa_snapshot/dispatcher
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-sms-render.txt -r .qa_snapshot/dispatcher/requirements-dispatcher-registration.txt 'Flask==3.0.3' 'Werkzeug==3.1.9' pytest
      - name: Verify native orders to real browser dispatcher assignment
        run: python -m pytest -v tests/test_qa_native_dispatcher_e2e.py
        env:
          PD_AUTH_TEST_DATABASE_URL: postgresql://postgres:isolated-test@127.0.0.1:5432/private_drive_test
          PD_NATIVE_SMS_LIVE: 'NO'
          PD_PAYMENT_MODE: disabled
