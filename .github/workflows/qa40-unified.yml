name: QA40 unified release
on:
  push:
    branches: [qa/qa40-unified-release]
permissions:
  contents: read
jobs:
  gps-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: private_drive_test
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d private_drive_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PD_AUTH_TEST_DATABASE_URL: postgresql://postgres:isolated-test@127.0.0.1:5432/private_drive_test
      PD_NATIVE_SMS_ISOLATED: 'YES'
      PD_NATIVE_SMS_LIVE: 'NO'
      PD_PAYMENT_MODE: disabled
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-sms-render.txt flask pytest
      - run: python ops/qa/qa38_release_audit.py
      - run: python -m pytest -vs tests/test_qa27_gps.py
  gps-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: flutter pub get
      - run: flutter test test/qa39_gps_test.dart --dart-define=PD_NATIVE_AUTH_API_URL=https://qa.invalid --reporter expanded
  cabin-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: private_drive_test
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d private_drive_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PD_AUTH_TEST_DATABASE_URL: postgresql://postgres:isolated-test@127.0.0.1:5432/private_drive_test
      PD_NATIVE_SMS_ISOLATED: 'YES'
      PD_NATIVE_SMS_LIVE: 'NO'
      PD_PAYMENT_MODE: disabled
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: python -m pip install -r requirements-sms-render.txt flask pytest
      - run: flutter pub get
        working-directory: flutter_app
      - name: Permit standard HTTPS port on ephemeral CI runner only
        run: |
          sysctl -n net.ipv4.ip_unprivileged_port_start > "$RUNNER_TEMP/qa40-original-port-floor"
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      - name: Verify runner permits isolated HTTPS port 443
        run: python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",443)); s.close()'
      - run: python -m pytest -vs tests/test_qa39_1_server_cabins.py
      - run: flutter test test/qa39_server_cabin_test.dart --dart-define=PD_NATIVE_AUTH_API_URL=https://qa.invalid --reporter expanded
        working-directory: flutter_app
      - name: Restore runner port policy
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/qa40-original-port-floor"; then
            sudo sysctl -w net.ipv4.ip_unprivileged_port_start="$(cat "$RUNNER_TEMP/qa40-original-port-floor")"
          fi
