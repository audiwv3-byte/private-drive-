name: PRIVATE DRIVE synthetic PostgreSQL least privilege
on:
  push:
    branches:
      - feature/web-dispatcher-browser-auth
    paths:
      - 'pd_db_privileges_ci.py'
      - 'test_db_privileges_ci_postgres.py'
      - 'pd_unified_accounts_schema.py'
      - '.github/workflows/pd-db-acl-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acl-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pd_schema_ci
          POSTGRES_USER: pd_ci
          POSTGRES_PASSWORD: synthetic-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pd_ci -d pd_schema_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PD_CI_FAKE_DB_ONLY: 'YES'
      PD_CI_POSTGRES_URL: 'postgresql://pd_ci:synthetic-only-password@127.0.0.1:5432/pd_schema_ci'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test-only PostgreSQL driver
        run: python -m pip install 'psycopg[binary]==3.2.13'
      - name: Verify roles, protected records, administrator and migrations
        run: python -m unittest -v test_db_privileges_ci_postgres.py
