name: PRIVATE DRIVE - deploy dormant PayPal integration with rollback
on:
  push:
    branches: [ops/paypal-readonly-live-audit-20261116]
    paths:
      - .github/workflows/pd-paypal-safe-release.yml
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile release and audit scripts
        run: python -m py_compile ops/pd_paypal_safe_deploy.py ops/pd_paypal_overlay_dryrun.py ops/pd_launch_readonly_smoke.py
      - name: Confirm live compatibility without any changes
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          python ops/pd_paypal_overlay_dryrun.py > /dev/null
          python ops/pd_launch_readonly_smoke.py > /dev/null
      - name: Deploy with verified offsite backups and automatic rollback
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          python ops/pd_paypal_safe_deploy.py > release_result.txt
      - name: Record sanitized outcome on isolated branch
        if: always()
        run: |
          if [ -f release_result.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add release_result.txt
            git commit -m "ops(paypal): report guarded disabled integration rollout" || true
            git push origin HEAD:ops/paypal-readonly-live-audit-20261116
          fi
