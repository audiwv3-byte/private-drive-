name: Native authentication tests
on:
  push:
    branches:
      - feature/flutter-independent-auth
  workflow_dispatch:
jobs:
  native-auth-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test OTP and Twilio Verify adapters without production access
        run: python -m unittest -v test_native_auth.py test_native_auth_http.py test_native_auth_sms.py test_native_auth_sessions.py test_twilio_verify.py test_native_auth_twilio_http.py test_native_sms_isolated_config.py
