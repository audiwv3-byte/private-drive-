name: PRIVATE DRIVE - PayPal production read-only compatibility audit
on:
  push:
    branches: [ops/paypal-readonly-live-audit-20261116]
    paths:
      - ops/pd_paypal_live_audit.py
      - .github/workflows/pd-paypal-live-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile ops/pd_paypal_live_audit.py
      - name: Inspect production code with GET-only API
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          python ops/pd_paypal_live_audit.py > reports/paypal_live_compatibility.txt
      - name: Save sanitized audit findings to isolated branch
        if: always()
        run: |
          if [ -f reports/paypal_live_compatibility.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/paypal_live_compatibility.txt
            git commit -m "audit(paypal): record safe live compatibility statuses" || true
            git push origin HEAD:ops/paypal-readonly-live-audit-20261116
          fi
