name: PRIVATE DRIVE - selected launch updates inventory (read only)
on:
  push:
    branches: [audit/selected-launch-updates-20261116]
    paths:
      - ops/selected_launch_live_inventory.py
      - .github/workflows/selected-launch-live-inventory.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check selected feature compatibility with existing production source
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p reports
          python ops/selected_launch_live_inventory.py > reports/selected_launch_live_inventory.txt
      - name: Save only sanitized inventory
        if: always()
        run: |
          if [ -f reports/selected_launch_live_inventory.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/selected_launch_live_inventory.txt
            git commit -m "audit: selected production launch inventory" || true
            git push origin HEAD:audit/selected-launch-updates-20261116
          fi
